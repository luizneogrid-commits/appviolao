    card('Como segurar o violão','<p>Sente na ponta da cadeira, coluna reta, os dois pés no chão. O violão apoia na perna direita (ou na esquerda, mais alto, como no clássico), com o braço do instrumento levemente para cima. O corpo do violão encosta no peito, sem apertar.</p><p>Mão esquerda: o polegar fica atrás do braço, mais ou menos na altura do dedo médio, e nunca por cima. Os dedos apertam com a ponta, curvados como se segurassem uma bola, perto do traste (a barra de metal), não no meio da casa.</p><p>Mão direita: o antebraço apoia na borda do violão e a mão cai solta sobre as cordas, na altura da boca.</p>')+
    card('Como ler o diagrama de acorde','<p>As seis linhas verticais são as cordas: a da esquerda é a 6ª, a mais grossa e grave; a da direita é a 1ª, a mais fina. As linhas horizontais são os trastes; a faixa preta em cima é a pestana do violão (o começo do braço).</p><p>Um círculo com número é um dedo apertando: 1 indicador, 2 médio, 3 anelar, 4 mindinho. O ○ em cima é corda solta (toca sem apertar); o × é corda que não toca. Um retângulo comprido é o dedo 1 deitado, a pestana. Quando aparece “3ª” ao lado, o desenho começa na casa 3.</p>'+acts('<button class="link" data-act="th-pick" data-c="C">Ver o C explicado corda por corda</button>'))+
    card('Palheta ou dedos?','<p>Violão de nylon costuma ser tocado com os dedos: polegar nas cordas graves, indicador, médio e anelar nas agudas. Violão de aço aceita bem a palheta, que dá mais volume e ataque nas batidas.</p><p>Palheta: segure entre o polegar e a lateral do indicador, deixando só a pontinha para fora, e relaxe a mão. Nas batidas, o movimento vem do cotovelo e do punho juntos, como quem sacode água da mão. Comece com palheta média (0,6 a 0,7 mm).</p>')+
    card('Dor nos dedos e calos','<p>Nas primeiras duas ou três semanas a ponta dos dedos dói: é normal. Sessões curtas (10 a 15 minutos) e frequentes fazem os calos aparecerem sem machucar. Não aperte mais do que o necessário para a nota soar limpa.</p><p>Dor nas articulações, no punho ou no ombro não é normal: pare, solte a mão e confira a postura. Alongue os dedos e o punho antes e depois de tocar. Corda de nylon ou um capotraste na casa 1 ou 2 deixam as cordas mais macias no começo.</p>')+
    card('Cordas: cuidar e trocar','<p>Passe um pano seco nas cordas depois de tocar; o suor as enferruja e apaga o brilho. Cordas que soam sem vida, não afinam mais ou têm marcas de ferrugem estão na hora de trocar: em geral a cada 3 a 6 meses para quem toca todo dia.</p><p>Nylon e aço não são intercambiáveis: cada violão é feito para um tipo. Depois de trocar, as cordas desafinam por um ou dois dias até assentarem; afine sempre antes de tocar.</p>'+acts('<button class="link" data-act="open-afinador">Abrir o afinador</button>'))+
    card('Afinar de ouvido pela casa 5','<p>Sem afinador nem microfone, dá para afinar comparando cordas vizinhas. Primeiro acerte a 6ª corda (Mi) por uma referência: o tom do app, um piano, outro violão. Depois, corda a corda:</p><ol class="steps"><li>6ª corda na casa 5 soa o Lá da 5ª solta.</li><li>5ª corda na casa 5 soa o Ré da 4ª solta.</li><li>4ª corda na casa 5 soa o Sol da 3ª solta.</li><li>3ª corda na casa <b>4</b> soa o Si da 2ª solta (a única exceção).</li><li>2ª corda na casa 5 soa o Mi da 1ª solta.</li></ol><p>Toque as duas notas juntas e ajuste a tarraxa da corda solta até o "batimento" (a ondulação do som) sumir. Se a solta estiver mais grave, aperte; mais aguda, afrouxe. No fim, confira um acorde de E: se soar limpo, está afinado.</p>'+acts('<button class="link" data-act="open-afinador">Ouvir os tons de referência</button>'))+
    '</div></section>';
  return guia+'<section class="panel"><h2>Conceitos</h2><p class="sub small">Toque num tema para abrir.</p><div style="margin-top:6px">'+
    card('Casa, semitom e oitava','<p>Cada casa do violão sobe a nota meio tom, o menor passo da música ocidental. Doze semitons formam uma oitava: a nota volta com o mesmo nome, só que mais aguda.</p><p>As 12 notas: Dó, Dó#, Ré, Ré#, Mi, Fá, Fá#, Sol, Sol#, Lá, Lá#, Si. Entre Mi e Fá e entre Si e Dó não existe sustenido: a distância já é de uma casa só.</p><p>O sustenido (#) sobe meio tom e o bemol (b) desce meio tom: Dó# e Réb ficam na mesma casa. O nome depende do acorde: em Cm se escreve Mib, e não Ré#.</p>'+acts('<button class="btn sm quiet" data-act="play-notes" data-m="40">Mi, 6ª corda solta</button><button class="btn sm quiet" data-act="play-notes" data-m="52">Mi, casa 12</button><button class="link" data-act="sub" data-g="acordes" data-v="notas">Ver as notas no braço</button>'))+
    card('Intervalo: a distância entre duas notas','<p>Intervalo é a distância entre duas notas, contada em semitons. O nome diz quantas notas da escala ele atravessa (terça, quinta, sétima) e o sobrenome diz o tamanho (menor, maior ou justa).</p><p>Toque numa nota para ouvir só ela. “Juntas” toca as duas ao mesmo tempo.</p><div class="ivl">'+ivl.map(x=>'<div class="ivl-row"><b>'+x[0]+' ('+x[1]+')</b> <small class="muted">'+x[2]+' semitons: de Dó a '+x[3]+'</small><div class="chips" style="margin-top:8px">'+note(48,'Dó')+note(48+x[2],x[3])+'<button class="chip" data-act="play-notes" data-m="48,'+(48+x[2])+'" data-g="0">Juntas</button></div></div>').join('')+'</div>')+
    card('Tríade: o acorde básico','<p>O acorde mais simples tem três notas, empilhadas de terça em terça: a tônica (a nota que dá nome ao acorde), a terça e a quinta. A letra da cifra é a tônica: em G, a tônica é Sol.</p><p>No violão, essas três notas se espalham pelas seis cordas, repetidas em outras alturas.</p>'+acts(note(48,'Dó (tônica)')+note(52,'Mi (terça)')+note(55,'Sol (quinta)')+'<button class="btn sm quiet" data-act="play-notes" data-m="48,52,55" data-g="0">As três juntas</button>'))+
    card('Acorde maior','<p>Tônica + terça maior (4 semitons) + quinta justa (7 semitons). Soa aberto e estável.</p><p>C = Dó, Mi e Sol. G = Sol, Si e Ré. D = Ré, Fá# e Lá.</p>'+acts(chords('C,G','Ouvir C e G')))+
    card('Acorde menor (m)','<p>Tônica + terça menor (3 semitons) + quinta justa. Em relação ao maior, só a terça muda: ela desce meio tom. O som fica mais fechado, mais triste.</p><p>Dá para ver isso no violão. De A para Am, só a 2ª corda muda: da casa 2 (Dó#) para a casa 1 (Dó). De E para Em, a 3ª corda sai da casa 1 (Sol#) e fica solta (Sol).</p>'+acts(chords('A,Am','Ouvir A e Am')+chords('E,Em','Ouvir E e Em')))+
    card('Quinta justa','<p>É o intervalo de 7 semitons. Quarta, quinta e oitava se chamam justas porque têm uma forma natural só, sem versão maior ou menor como a terça. Por isso a quinta é a mesma no acorde maior e no menor.</p><p>Depois da oitava, é o intervalo mais estável. Tônica e quinta sem a terça formam o power chord (E5, A5), muito usado no rock: ele não é maior nem menor.</p>'+acts(note(40,'Mi')+note(47,'Si')+'<button class="chip" data-act="play-notes" data-m="40,47" data-g="0">Juntas</button>'+chords('E,E5')+chords('A,A5')))+
    card('Acorde com sétima (7)','<p>Acorde maior + sétima menor, 10 semitons acima da tônica. G7 = Sol, Si, Ré e Fá.</p><p>Também é chamado de dominante: cria uma tensão que pede para resolver no acorde que fica uma quinta abaixo. G7 puxa para C, D7 puxa para G, E7 puxa para A ou Am.</p>'+acts(chords('G7,C','Ouvir G7 e C')+chords('E7,Am','Ouvir E7 e Am')))+
    card('Sétima maior (maj7 ou 7M)','<p>Acorde maior + sétima maior, 11 semitons acima da tônica, meio tom abaixo da oitava. Soa suave e aberto, e é comum na bossa nova e na MPB.</p><p>De C para Cmaj7, só a 2ª corda muda: da casa 1 (Dó) para solta (Si).</p>'+acts(chords('C,Cmaj7','Ouvir C e Cmaj7')))+
    card('Menor com sétima (m7)','<p>Acorde menor + sétima menor. Am7 = Lá, Dó, Mi e Sol. Soa mais macio que o menor sem a sétima.</p>'+acts(chords('Am,Am7','Ouvir Am e Am7')))+
    card('Suspensos (sus2, sus4) e add9','<p>No acorde suspenso, a terça sai e entra a segunda (sus2) ou a quarta (sus4). Sem terça, o acorde não é maior nem menor: fica no ar, pedindo para voltar. Por isso ele quase sempre resolve no acorde comum de mesma tônica: Dsus4 volta para D.</p><p>O add9 é o contrário: mantém a terça e acrescenta a nona, a segunda uma oitava acima. Cadd9 = Dó, Mi, Sol e Ré. Mais cheio, mais aberto.</p><p>No violão, muitas vezes é só um dedo: de A para Asus4, o dedo 4 entra na 2ª corda, casa 3. De D para Dsus4, a 1ª corda vai da casa 2 para a casa 3.</p>'+acts(chords('A,Asus4')+chords('D,Dsus4')+chords('C,Cadd9')))+
    card('Acordes com baixo (D/F#, C/G)','<p>A barra na cifra diz qual nota fica no baixo: D/F# é o D com Fá# como nota mais grave. As notas do acorde não mudam; muda a ordem, e a mais grave é a que o ouvido segue.</p><p>Serve para a linha do baixo andar por graus: em G, D/F#, Em, o baixo desce Sol, Fá#, Mi, um passo de cada vez. Em C, G/B, Am, desce Dó, Si, Lá.</p><p>No violão, o baixo novo costuma entrar com o dedo 2 ou o mindinho na 6ª corda; muita gente usa o polegar por cima do braço no D/F#.</p>'+acts(chords('D,D/F#')+chords('G,D/F#,Em')+chords('C,G/B,Am')))+
    card('Por que algumas cordas não tocam (×)','<p>A nota mais grave, o baixo, define muito do som do acorde. Quando uma corda grave solta daria uma nota que não é do acorde, ou uma nota do acorde que ficaria abaixo da tônica, ela não é tocada.</p><p>No C, a 6ª corda solta é Mi: é nota do acorde, mas viraria o baixo e o acorde ficaria menos firme. No D, a 6ª corda (Mi) nem faz parte do acorde.</p>')+
    card('Pestana: desenhos que andam pelo braço','<p>Na pestana, o dedo 1 deitado funciona como um capotraste, e os outros dedos repetem o desenho de um acorde com cordas soltas.</p><p>Como cada casa sobe tudo meio tom, o mesmo desenho serve para vários acordes. O desenho do E na casa 1 é F, e na casa 3 é G. O desenho do Am na casa 2 é Bm, e na casa 3 é Cm.</p>'+acts(chords('E,F','Ouvir E e F')))+
    card('Como ler a cifra','<p>A letra é a tônica: C = Dó, D = Ré, E = Mi, F = Fá, G = Sol, A = Lá, B = Si.</p><p># (sustenido) sobe meio tom e b (bemol) desce meio tom: F# = Fá sustenido, Bb = Si bemol.</p><p>m = menor. 7 = sétima menor. maj7 ou 7M = sétima maior. m7 = menor com sétima. Sem nenhum sinal, o acorde é maior: G = Sol maior.</p>')+
    '</div></section>';
}
function spark(arr){const v=arr.slice(-10).map(r=>r.n);if(v.length<2)return '';const mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=(mx-mn)||1;return '<svg viewBox="0 0 90 28" aria-hidden="true"><polyline points="'+v.map((n,i)=>(3+i*(84/(v.length-1))).toFixed(1)+','+(24-(n-mn)/r*20).toFixed(1)).join(' ')+'"/></svg>';}

function roadNow(){ // painel curto na tela Hoje: em que semana a pessoa está e qual é a meta
  const n=S.level,L=LEVELS[n-1],w=weekOf(n),W=ROAD[n-1][w],k=n+'.'+w,done=levelDone(n);
  let h='<section class="panel road-now"><div class="between"><h3>'+(done&&n===LEVELS.length?'Manutenção: roteiro concluído':'Roteiro: nível '+n+', semana '+(w+1)+' de '+ROAD[n-1].length)+'</h3><button class="link" style="padding:0;min-height:0" data-act="open-roteiro">Ver roteiro</button></div>';
  if(done)h+='<p class="sub">Nível '+n+' concluído: as quatro metas estão cumpridas.</p>'+(n<LEVELS.length?'<button class="btn sm" style="margin-top:12px" data-act="set-level" data-l="'+(n+1)+'">Subir para o nível '+(n+1)+'</button>':'<p class="sub small">Você chegou ao fim do roteiro. Hoje passa a ser manutenção: cada dia revisita uma semana diferente, com os seus pares mais lentos e as suas músicas.</p>');
  else h+='<p class="sub">'+esc(W.t)+'</p>'+metaBtn(k,'Meta da semana: '+esc(L.skills[w]))+'<p class="muted small">Marque quando conseguir. O treino de Hoje passa para a semana seguinte.</p>';
  return h+'</section>';
}
function roadView(){
  const n=S.level,L=LEVELS[n-1],done=roadDone(),pct=Math.round(done/ROAD_TOTAL*100);
  let h='<section class="panel"><div class="between"><h2>Seu roteiro</h2><span class="tag">nível '+n+'</span></div><p class="sub">'+(n<LEVELS.length?'Do nível '+n+', '+esc(L.name)+', até o nível '+LEVELS.length:'Nível '+n+', '+esc(L.name)+': o último do roteiro')+'. Cada nível tem 4 semanas e cada semana tem uma meta. Marque a meta quando conseguir: o treino de Hoje passa para a semana seguinte. Sem pressa: uma semana pode levar mais de sete dias.</p>';
  h+='<div class="prog"><i style="width:'+pct+'%"></i></div><div class="between small muted" style="margin-top:6px"><span>'+done+' de '+ROAD_TOTAL+' semanas vencidas</span><span>faltam '+roadEstimate(n,S.goal,done)+'</span></div>';
  h+='<p class="muted small" style="margin-top:8px">A estimativa considera '+S.goal+' min por dia'+(S.levelSince?'. Neste nível desde '+esc(dayTxt(S.levelSince)):'')+'.</p>';
  h+='<div class="acts" style="margin-top:6px"><button class="link" data-act="open-perfil">Mudar meu nível ou a meta diária</button></div></section>';
  return h+LEVELS.map((L,i)=>roadLevel(i+1)).join('');
}
function roadLevel(n){
  const L=LEVELS[n-1],cur=n===S.level,past=n<S.level,all=levelDone(n),w=weekOf(n);
  const tag=cur?'<span class="tag">nível atual</span>':past?'<span class="tag done">concluído</span>':'<span class="muted small">a seguir</span>';
  let h='<details class="road-lvl'+(cur?' cur':'')+'"'+(cur?' open':'')+'><summary><span class="rl-head"><h2>'+n+'. '+esc(L.name)+'</h2>'+tag+'</span><span class="sub small rl-desc">'+esc(L.desc)+' Acordes: '+L.chords.join(', ')+'.</span></summary><div class="road-weeks">';
  ROAD[n-1].forEach((W,j)=>{
    const k=n+'.'+j,ok=past||skillDone(k),now=cur&&!all&&j===w,P=PAT[W.pat],chords=[...new Set([].concat(...W.progs,...W.pairs))];
    h+='<div class="road-wk'+(ok?' ok':'')+(now?' now':'')+'"><div class="road-hd"><span class="wk">'+(ok?'✓':j+1)+'</span><div><b>Semana '+(j+1)+': '+esc(W.t)+'</b>'+(now?' <span class="tag">você está aqui</span>':'')+'</div></div>';
    h+=metaBtn(k,'Meta: '+esc(L.skills[j]));
    h+='<ul class="road-list"><li><b>Técnica:</b> '+W.tech.map(esc).join(' ')+'</li><li><b>Trocas:</b> '+W.pairs.map(p=>p.join(' e ')).join('; ')+'.</li><li><b>Batida:</b> '+esc(P.name)+', a '+W.bpm+' BPM.</li><li><b>Repertório:</b> '+W.progs.map(p=>p.join(' ')).join(' / ')+'.</li></ul>';
    h+='<div class="chips road-ch">'+chords.map(c=>'<button class="chip" data-act="th-open" data-c="'+esc(c)+'" aria-label="Como se forma o '+esc(c)+'">'+esc(c)+'</button>').join('')+'</div><p class="muted small" style="margin-top:6px">Toque num acorde para ver como ele é formado.</p>';
    h+='<div class="acts"><button class="btn sm quiet" data-act="road-build" data-l="'+n+'" data-w="'+j+'">Montar este treino</button><button class="link" data-act="open-batida" data-p="'+W.pat+'" data-bpm="'+W.bpm+'">Ouvir a batida</button><button class="link" data-act="open-trocas" data-a="'+esc(W.pairs[0][0])+'" data-b="'+esc(W.pairs[0][1])+'">Contar trocas</button>'+(W.scale?'<button class="link" data-act="road-scale" data-pc="'+W.scale.pc+'" data-sc="'+W.scale.sc+'" data-pos="'+(W.scale.pos!=null?W.scale.pos:'')+'">Tocar junto a escala</button>':'')+'</div></div>';
  });
  h+='</div>';
  if(cur&&all&&n<LEVELS.length)h+='<button class="btn block" style="margin-top:14px" data-act="set-level" data-l="'+(n+1)+'">Subir para o nível '+(n+1)+'</button>';
  else if(!cur)h+='<button class="link" data-act="set-level" data-l="'+n+'">'+(past?'Voltar a este nível':'Pular para este nível')+'</button>';
  return h+'</details>';
}
function perfilView(){
  let h='<section class="panel" id="pf-nivel"><h2>Seu nível</h2><p class="sub small">O roteiro e o treino de Hoje seguem o nível escolhido. Mudar de nível não apaga nada: as metas de cada nível ficam guardadas.</p><div class="choices">'+LEVELS.map((L,i)=>{const n=i+1;return '<button class="choice" data-act="set-level" data-l="'+n+'" aria-pressed="'+(S.level===n)+'"><b>'+n+'. '+esc(L.name)+'</b><span>'+OB[i][0]+'. '+OB[i][1]+'</span></button>';}).join('')+'</div></section>';
  h+='<section class="panel"><h2>Meta diária</h2><p class="sub small">Quanto tempo o treino de Hoje deve ter.</p><div class="row" style="margin-top:12px">'+[10,15,20,30].map(g=>'<button class="chip" data-act="goal" data-v="'+g+'" aria-pressed="'+(S.goal===g)+'">'+g+' min</button>').join('')+'</div>';

  h+='<section class="panel"><h2>Seu nome</h2><p class="sub small">Opcional. Aparece no cumprimento da tela Hoje.</p><input class="inp" id="p-name" maxlength="30" placeholder="Como quer ser chamado?" aria-label="Seu nome" value="'+esc(S.name)+'" style="margin-top:12px"></section>';
  h+='<section class="panel" id="pf-lembrete"><h2>Lembrete diário</h2><p class="sub small">'+(NATIVE?'Uma notificação no horário escolhido, todo dia.':'No site, o lembrete vai para o seu calendário: escolha o horário e adicione o evento, que se repete todo dia.')+' Quem pratica sempre na mesma hora falta menos.</p><div class="chips" style="margin-top:12px"><button class="chip" data-act="remind" data-v="" aria-pressed="'+!S.remind+'">Desligado</button>'+REMIND_TIMES.map(t=>'<button class="chip" data-act="remind" data-v="'+t+'" aria-pressed="'+(S.remind===t)+'">'+t+'</button>').join('')+'</div>'+intentPanel()+splitPanel()+(NATIVE&&S.remind?'<div class="between" style="margin-top:12px"><span>Aviso de última hora às 21h, só se ainda não praticou</span><button class="chip" data-act="remind-late" aria-pressed="'+!!S.remindLate+'">'+(S.remindLate?'Ligado':'Desligado')+'</button></div>':'')+(S.remind?'<div class="acts" style="margin-top:12px"><button class="btn sm line" data-act="remind-ics">Adicionar ao calendário</button><span class="muted small">'+(NATIVE?'alternativa à notificação: um evento diário no calendário do celular':'arquivo .ics: abra para criar o evento diário no calendário do celular ou do computador')+'</span></div>':'')+'</section>';
  h+=installPanel()+aboutPanel()+sndPanel();

function chordFacts(c){ /* no cartão do acorde: situação, músicas suas que o usam e o recorde de trocas com ele */
  const st=S.chords[c]==='dominado'?'Dominado':S.chords[c]==='aprendendo'?'Aprendendo':'',songs=S.songs.filter(s=>songChords(s).includes(c)),rec=Object.keys(S.changes).filter(k=>k.split('|').includes(c)).map(k=>[bestOf(k),k.split('|').find(x=>x!==c)||c]).sort((a,b)=>b[0]-a[0])[0];
  const parts=[];if(st)parts.push(st);if(songs.length)parts.push('em '+songs.length+(songs.length===1?' música sua':' músicas suas'));if(rec&&rec[0])parts.push('recorde de trocas: '+rec[0]+' com '+rec[1]);
  return parts.length?'<div class="muted small" style="margin-top:4px">'+esc(parts.join(' · '))+'.</div>':'';
}
function cifraParse(t,k){ // html: linhas em que a maioria das palavras são acordes viram botões; seq: acordes conhecidos na ordem, para tocar junto; raw: todos os acordes; secs: seções (rótulo e índice do acorde em que começam)
  const seq=[],raw=[],secs=[],clean=w=>w.replace(/[()|,]/g,'');
  const lines=t.split('\n').map(line=>{const toks=line.trim().split(/\s+/).filter(Boolean);if(TABRE.test(line))return '<span class="cif-tab">'+esc(line)+'</span>'; /* tablatura: monoespaçada, rola de lado e fica fora dos acordes */
    if(!toks.length||toks.filter(w=>CHRE.test(clean(w))).length/toks.length<.6){const lt=line.trim(),m=SECRE.exec(lt)||BRRE.exec(lt);if(m)return secTag(m[1].trim(),secs,seq.length);if(CPRE.test(line))return inlineChords(line,k,seq,raw);return esc(line);}
    return {cl:line.replace(/\S+/g,w=>{if(BRRE.test(w))return secTag(BRRE.exec(w)[1].trim(),secs,seq.length);const c=clean(w);if(!CHRE.test(c))return esc(w);raw.push(c);const tn=transposeName(c,k),shown=w.replace(c,tn);
      if(!CH[tn])return '<span class="cif-ch off" title="O app ainda não tem o desenho do '+esc(tn)+'">'+esc(shown)+'</span>';
      seq.push(tn);return '<button class="cif-ch" data-act="cif-ch" data-c="'+esc(tn)+'" data-i="'+(seq.length-1)+'">'+esc(shown)+'</button>';})};
  });
  const html=lines.map((l,i)=>{const nl=i<lines.length-1?'\n':'';return typeof l==='string'?l+nl:'<span class="cl">'+l.cl+nl+'</span>';}).join(''); /* linha de acordes num span com a própria quebra, para "Só a letra" esconder as duas */
  return {html,seq,raw,secs};
}
function cifraTransposeText(t,k){ // a cifra como texto, com os acordes das linhas de acordes transpostos (para compartilhar no tom da tela)
  if(!k)return t;const clean=w=>w.replace(/[()|,]/g,'');
  return t.split('\n').map(line=>{const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length||toks.filter(w=>CHRE.test(clean(w))).length/toks.length<.6)return CPRE.test(line)?line.replace(/\[([^\]]{1,12})\]/g,(m,c)=>CHRE.test(c)?'['+transposeName(c,k)+']':m):line;
    return line.replace(/\S+/g,w=>{const c=clean(w);return CHRE.test(c)?w.replace(c,transposeName(c,k)):w;});}).join('\n');
}
function cifraChordsList(t){ // acordes das linhas de acordes de uma cifra, na ordem e sem repetir: preenche a lista da música quando ela fica em branco

  const k=svShift(s),ch=songChords(s),tom=(s.tr||s.capo)?'Tom: '+(s.tr?tomTxt(s.tr):'original')+(s.capo?', capotraste na casa '+s.capo+' (acordes como na tela)':'')+'\n':'';

function songKey(s){ // tom provável pelos acordes: cada tom maior ganha pontos pelos graus presentes (I, IV e V pesam mais; ii, iii e vi contam; fora do tom desconta)
  const chords=songChords(s).map(n=>{const m=CHRE.exec(n);if(!m)return null;const q=/^(m|min)(?!aj)/.test(m[3])?'m':/dim|°|º/.test(m[3])?'dim':'M';return {pc:pcOf(m[1],m[2]),q,dom:q==='M'&&/7/.test(m[3])&&!/maj7/.test(m[3])};}).filter(Boolean);
  if(chords.length<2)return null;
  const deg=[[0,'M',3],[5,'M',2],[7,'M',2],[2,'m',1],[4,'m',1],[9,'m',1.5],[11,'dim',.5]];let best=null;
  for(let k=0;k<12;k++){let sc=0;chords.forEach(c=>{const d=deg.find(x=>(k+x[0])%12===c.pc&&x[1]===c.q);sc+=d?d[2]+(c.dom&&d[0]===7?1:0):-1.5;});if(!best||sc>best.sc)best={k,sc};}
  if(best.sc<=0)return null;
  const rel=(best.k+9)%12,minorFirst=chords[0].pc===rel&&chords[0].q==='m';
  return {k:best.k,major:NPT[best.k]+' maior',minor:NPT[rel]+' menor',minorFirst,chords:deg.slice(0,6).map(x=>TRN[(best.k+x[0])%12]+(x[1]==='m'?'m':''))};
}
function songsView(){ // a lista como está na tela: busca por nome ou acorde e a ordem escolhida (cadastro, nome, recentes, situação)
  const q=(SV.q||'').trim().toLowerCase(),qc=CHRE.test((SV.q||'').trim())?(SV.q||'').trim():'';let arr=S.songs.filter(s=>!q||s.title.toLowerCase().includes(q)||(qc?songChords(s).includes(qc)||(s.chords||'').split(/[\s,]+/).includes(qc):(s.chords||'').toLowerCase().includes(q))); /* um nome de acorde busca o acorde exato (C não traz Cm) */const rank={aprendendo:0,devagar:1,dominada:2};
  if(SV.sort==='nome')arr=arr.slice().sort((a,b)=>a.title.localeCompare(b.title,'pt-BR'));
  else if(SV.sort==='recentes')arr=arr.slice().sort((a,b)=>(b.lastPlay||'').localeCompare(a.lastPlay||'')||(b.plays||0)-(a.plays||0));
  else if(SV.sort==='situacao')arr=arr.slice().sort((a,b)=>(rank[a.status]||0)-(rank[b.status]||0)||a.title.localeCompare(b.title,'pt-BR'));
  return arr;
}
function songChordSet(){const out=new Set();S.songs.forEach(x=>songChords(x).forEach(n=>out.add(n)));return out;} // todos os acordes conhecidos das músicas cadastradas (filtro da biblioteca)
function songChords(s){ // acordes conhecidos da música, já transpostos: os da lista e os da cifra, sem repetir
  const k=svShift(s),out=[],add=n=>{if(CH[n]&&!out.includes(n))out.push(n);};
  (s.chords||'').split(/[\s,]+/).filter(Boolean).forEach(w=>add(transposeName(w,k)));cifraParse(s.cifra||'',k).seq.forEach(add);return out;
}
function capoSuggest(s){ // menor casa de capotraste em que nenhum acorde exige pestana inteira (ou desenho que o app não tem)
  const names=[...new Set((s.chords||'').split(/[\s,]+/).filter(w=>CHRE.test(w)).concat(cifraParse(s.cifra||'',0).raw))];if(!names.length)return null;
  const hard=n=>!CH[n]||!!(CH[n].barre&&CH[n].barre.from===0&&!(CH[n].easy&&S.easyOn[n]));
  if(!names.some(n=>hard(transposeName(n,svShift(s)))))return null;
  for(let c=1;c<=7;c++)if(!names.some(n=>hard(transposeName(n,(s.tr||0)-c))))return c;
  return null;
}

const CFI={f:[-1,-1,-1,-1,-1,-1],base:1},MS={form:0,fret:1}; // identificador: uma casa por corda (−1 não toca, 0 solta, n casa), base é a primeira casa mostrada; MS: forma móvel e casa da pestana
const FORMS=[['',[0,4,7]],['m',[0,3,7]],['5',[0,7]],['7',[0,4,7,10]],['m7',[0,3,7,10]],['maj7',[0,4,7,11]],['sus2',[0,2,7]],['sus4',[0,5,7]],['7sus4',[0,5,7,10]],['dim',[0,3,6]],['aug',[0,4,8]],['add9',[0,2,4,7]],['m7b5',[0,3,6,10]],['dim7',[0,3,6,9]],['6',[0,4,7,9]],['m6',[0,3,7,9]],['9',[0,2,4,7,10]],['m9',[0,2,3,7,10]],['mmaj7',[0,3,7,11]]]; // sufixo e intervalos a partir da tônica

function movShape(k,fret){const m=MOV[k],root=((m[0][0]==='E'?4:9)+fret)%12;return {n:TRN[root]+m[1],f:m[2].map(x=>x<0?-1:x+fret),d:m[3].slice(),barre:{fret,from:m[4][0],to:m[4][1]},form:m[0]};}
function barreAlt(name){ // a forma com pestana de um acorde maior, menor ou com sétima: forma de E ou de A, a que fica mais perto da pestana
  const m=/^([A-G])([#b]?)(m|7)?$/.exec(name||'');if(!m)return null;const pc=pcOf(m[1],m[2]),q=m[3]||'',fe=(pc-4+12)%12||12,fa=(pc-9+12)%12||12;
  const mk=(useE,fret)=>Object.assign(movShape((useE?0:3)+(q===''?0:q==='m'?1:2),fret),{n:name+' (pestana)'});

  return alt;

function chordIdentify(f){ // nome do acorde pelas notas: cada nota como tônica, cada fórmula; tônica no baixo vale mais, senão vira acorde com baixo (C/E); a quinta pode faltar
  const midis=f.map((x,i)=>x<0?null:OPEN[i]+x).filter(m=>m!==null);if(midis.length<2)return null;
  const bass=Math.min.apply(null,midis)%12,set=[...new Set(midis.map(m=>m%12))].sort((a,b)=>a-b),key=set.join(','),out=[];
  set.forEach(root=>{FORMS.forEach(([suf,iv])=>{const full=iv.map(x=>(root+x)%12).sort((a,b)=>a-b).join(','),no5=iv.length>2&&iv.includes(7)?iv.filter(x=>x!==7).map(x=>(root+x)%12).sort((a,b)=>a-b).join(','):null;
    if(full===key)out.push({root,suf,score:(root===bass?0:2)+iv.length*.1});else if(no5&&no5===key)out.push({root,suf,score:1+(root===bass?0:2)+iv.length*.1});});});
  const notes=set.map(p=>TRN[p]+' ('+NPT[p]+')'),lib=CHORDS.find(c=>c.f.join()===f.join());

  out.sort((a,b)=>a.score-b.score);const nm=x=>TRN[x.root]+x.suf+(x.root!==bass?'/'+TRN[bass]:''),name=nm(out[0]);
  return {name,alts:out.slice(1).map(nm).filter((x,i,a)=>x!==name&&a.indexOf(x)===i).slice(0,3),notes,midis,lib:lib?lib.n:null};
}

function updPaint(){const w=$('#upd-wrap');if(w)w.hidden=!PWA.update;}
async function checkUpdate(force){
  if(!PWA.host||!VER)return;const now=Date.now();if(!force&&now-PWA.lastCheck<36e5)return;PWA.lastCheck=now;
  try{if(PWA.reg)PWA.reg.update().catch(()=>{});
    const r=await fetch(location.pathname+'?check='+now,{cache:'no-store'});if(!r.ok)throw new Error('http');
    const m=(await r.text()).match(/<meta name="app-version" content="([^"]+)"/);
    if(m&&m[1]!==VER){PWA.update=true;PWA.msg='Versão '+m[1]+' disponível.';updPaint();}else if(force)PWA.msg='Você já está na versão mais recente.';
  }catch(e){if(force)PWA.msg='Sem conexão para verificar agora.';}
  if(force)render();
}
if(PWA.host){
  if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){navigator.serviceWorker.register('sw.js').then(r=>{PWA.reg=r;}).catch(()=>{});}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();PWA.prompt=e;render();});
  window.addEventListener('appinstalled',()=>{PWA.prompt=null;render();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false);});
}

 ['1.52.0',['Ao colar uma cifra de site com “Tom: A” e “Capotraste na 2ª casa”, o app já marca o capotraste e mantém os acordes como escritos; a linha do tom mostra o que veio na cifra.','Adicionar uma música com o mesmo nome de outra pede confirmação, com atalho para abrir a que já existe.','O que você digita em “Adicionar música” fica guardado como rascunho até adicionar ou descartar, mesmo trocando de tela.','O cartão do acorde na cifra mostra a situação, em quantas músicas suas ele aparece e o recorde de trocas, com “Músicas com este acorde”; na busca, o nome de um acorde encontra só o acorde exato.']],
 ['1.51.0',['Treinar, Mãos: além da mão esquerda, oito exercícios para a mão direita (polegar, baixo alternado, i e m, arpejos P-I-M-A e P-A-M-I, valsa, pinça e base de bossa), com o tocar junto acendendo a célula da vez, o acorde à escolha e o BPM.']],
 ['1.50.0',['Cifra e palco: “Só a letra” esconde as linhas de acordes e os colchetes, para cantar na roda.','Linhas de tablatura (e|--3--) ficam inteiras, rolando de lado, e fora da lista de acordes.','Voltar onde parou: se o app fechar no meio de uma música e você voltar em até 30 minutos, ela reabre no mesmo lugar.','Perfil, Seus dados: o espaço usado, se ele é persistente, e “Apagar as antigas” para as gravações, mantendo as dez últimas.']],
 ['1.49.0',['Tocar junto: “Surpresa”, acordes sorteados entre os do seu nível e das suas músicas, trocados a cada volta, com o próximo anunciado no último compasso. Atalho em Treinar, Trocas.','Trocas: “Par sugerido”, os pares do seu nível ainda não medidos ou com o menor recorde, prontos com um toque.','Ouvido: “Batida”, o app toca dois compassos de uma batida e você diz qual foi; sobe de nível com dez respostas e 80% de acerto.']],
 ['1.48.0',['Acordes, Teoria: “Campo harmônico”, os sete acordes de cada tom (maior ou menor) com grau, função e desenho; a cadência para ouvir; progressões comuns com “Tocar junto”; e “Monte a sua progressão”, para ouvir, tocar junto ou salvar como treino.','Na cifra, a linha do tom provável ganhou “Ver o campo harmônico” e aponta os acordes fora do tom (empréstimos).']],
 ['1.47.0',['Em tablet e computador, Hoje fica em duas colunas: o treino à esquerda; avisos, desafio da semana e cópia de segurança à direita.','Guia do iniciante: “Afinar de ouvido pela casa 5”, com atalho no afinador para quando não há microfone.']],
 ['1.46.0',['Gravações: “Compartilhar” manda o áudio pelo compartilhamento do celular (no site, baixa o arquivo).','Evolução: “Dias da semana”, os minutos em cada dia da semana desde o começo, com o seu dia mais forte.','Evolução: “Imprimir a evolução”, uma versão para papel com gráficos, marcas e conquistas.']],
 ['1.45.0',['Cifra: “Repetir” ao lado de “Ir para” marca o trecho em loop pela seção (intro, refrão, ponte) com um toque.','Palco com o tocar junto ligado: o acorde da vez e o próximo aparecem grandes no alto da cifra.','Perfil, Som: vibrar na troca de acorde no tocar junto e nas batidas, para praticar com fone sem olhar a tela.']],
 ['1.44.0',['Treinar, Mão esquerda: nove exercícios de mobilidade e de troca de acordes (aranha, independência 1-3-2-4, 4-3-2-1, alongamento, mindinho, trilhos, pivô com dedo âncora, voo dos dedos e pressão mínima), com o exemplo tocado casa por casa e metrônomo.','O aquecimento de Hoje ganha dois exercícios novos e o atalho para a Mão esquerda.']],
 ['1.43.0',['Evolução, Diário: “Ver todos” quando há mais de dez registros.','Conquistas por vir mostram quanto falta (minutos, dias, trocas, respostas, músicas).','Ficha e capturas da loja com o desafio da semana e os desenhos no treino.']],
 ['1.42.0',['Bloco em andamento fora de Hoje: a pílula no rodapé mostra o bloco e o tempo que falta e volta para Hoje ao tocar; Batidas, Trocas, Tempo e Metrônomo ganham “Voltar ao treino”.','Quando o tempo do bloco acaba em qualquer tela, um aviso diz qual bloco terminou e quanto contou.']],
 ['1.41.0',['Painéis que viram atalhos: a faixa da semana em Hoje abre Evolução; “Esta semana” abre a meta em Perfil; em Evolução, Repertório abre Músicas, Ouvido por modalidade abre o treino de ouvido e as Marcas levam a Acordes, Trocas e Metrônomo.','Na lista de músicas, tocar no nome abre a cifra.','Barras dos gráficos com dica (dia ou semana e valor) ao tocar ou passar o mouse.','“Somar 5 min” e a situação da música agora confirmam com um aviso.']],
 ['1.40.2',['O painel do desafio da semana, em Hoje, agora é um atalho: toque nele para ir às trocas com o par do desafio, à música, ao treino de ouvido ou ao treino de hoje.']],
 ['1.40.1',['Concluir o bloco de aquecimento (ou a escala tocada junto) para o som na hora; antes ele seguia até trocar de tela.']],

 ['1.39.0',['Tema escuro: os campos de texto ficam com a cor certa (a cifra colada aparecia preta sobre fundo escuro).','Ajuda atualizada com as telas novas e uma seção com os atalhos do computador.','Testes de tela também em largura de tablet e auditoria de acessibilidade nos dois temas.']],
 ['1.38.0',['Evolução, Números: “Onde vai o tempo”, os minutos por tipo de bloco (aquecimento, técnica, ritmo, trocas, repertório, prática livre).','Desafio da semana em Hoje: um objetivo tirado dos seus dados (dias, minutos, trocas, uma música inteira ou acertos seguidos no ouvido), com a contagem em Evolução.','Gravação de 30 ou 60 segundos.','No cadastro, “Não sei meu nível”: três perguntas rápidas sugerem o nível inicial.']],
 ['1.37.0',['Cifras com o acorde entre colchetes no meio da letra ([C]letra) agora ganham botões, desenhos e tocar junto.','Forma com pestana: no desenho do acorde da cifra e na biblioteca, a versão na forma de E ou de A para maiores, menores e com sétima.','Rolagem “no ritmo”: no palco, a cifra inteira passa no tempo que a música leva.','Em tablet e computador, a música fica em duas colunas: tocar junto à esquerda, cifra à direita.']],
 ['1.36.0',['Ouvido em níveis: intervalos e acordes começam com poucas opções e ampliam depois de dez respostas com 80% de acerto.','Leitor de tela: ao trocar de aba, o foco vai para o título da tela nova.','Ficha da loja atualizada com o que entrou desde a 1.31.']],
 ['1.35.0',['Importar com “Juntar com o que já tenho”: dias, músicas, batidas, acordes, treinos, marcas e conquistas do arquivo somam-se ao aparelho.','Afinação guiada: as seis cordas numa lista que marca a que está soando e as que já afinaram.','No app Android, aviso de última hora às 21h nos dias sem prática (Perfil, Lembrete diário).','Hoje: “Outro exercício” no bloco de técnica.']],
 ['1.34.0',['Músicas: busca por nome ou acorde e ordem por nome, recentes ou situação; cada linha mostra quantas vezes tocou junto e quando foi a última.','Evolução, Números: painel Repertório, com as músicas por situação e a mais tocada.','Biblioteca, filtro Das minhas músicas: os acordes das suas cifras que o app não conhece, com atalho para desenhar em Descobrir.','Tocar junto: “Bater o andamento” define o BPM pelo seu toque.']],
 ['1.33.0',['Biblioteca de acordes com o filtro “Das minhas músicas”, além de “Meus”.','Treino compartilhado por link leva a batida própria junto: quem recebe ganha a batida como sua.','Imprimir a cifra: título, desenhos dos acordes e a cifra, sem os controles.']],
 ['1.32.0',['Modo roda: no palco, Anterior e Próxima seguem a ordem da sua lista de músicas (no computador, as setas).','Tocar junto com “Subir aos poucos”: a cada volta completa o andamento sobe 4 BPM, até 160.','Cópia “ao sair”: além das diárias, uma cópia de quando o app foi para segundo plano pela última vez, em Perfil, Seus dados.','Lembrete no calendário: um arquivo .ics com repetição diária, para o site instalado, o iPhone e o computador.']],
 ['1.31.0',['Acordes meus: em Descobrir, guarde um desenho com nome; ele entra na biblioteca (filtro Meus), vira botão com desenho e som nas cifras e toca no tocar junto.','Seções da cifra ([Intro], Refrão:) viram atalhos “Ir para”, também no palco, e aparecem no trecho em loop.','Cifras até 12 mil caracteres, com aviso quando o fim é cortado.','Compartilhar a música manda a cifra no tom da tela, com transposição e capotraste.']],
 ['1.30.0',['Ouvido, Braço: ouça a nota e toque no braço onde ela está; vale qualquer posição com a mesma altura.','Seis conquistas novas: cem dias de violão, cem dias seguidos, 3000 minutos, primeira música dominada, cinco dominadas e batida própria.','Ficha e capturas da loja atualizadas com tudo o que entrou nas últimas versões.']],
 ['1.29.0',['Tocar junto com trecho em loop: escolha o acorde de início e o de fim e só aquela parte se repete.','Perfil, Som: volumes separados para o violão e para o clique ou bateria.','Botão Voltar do Android e tecla Esc fecham o que está aberto por cima (desenho do acorde, palco, música) antes de voltar para Hoje.','Depois de tocar junto uma música inteira três vezes, o app sugere marcá-la como dominada.']],
 ['1.28.0',['Acordes, Descobrir: marque as casas num diagrama e o app diz que acorde é, mostra as notas e toca; abaixo, as formas móveis de E e de A em qualquer casa.','Na cifra, o tom provável da música (com o relativo) e os acordes do tom.','Remover uma música pede confirmação e dá para desfazer.']],
 ['1.27.0',['Depois do nível 9, Hoje vira manutenção: cada dia revisita uma semana do roteiro, com os seus pares de troca mais lentos e as suas músicas.','Evolução, Números: minutos por semana nas últimas 12 semanas (com a meta semanal), melhor troca por minuto de cada semana e acertos do ouvido por modalidade.','Hoje, em Mais: “Praticar agora” liga um cronômetro que conta mesmo com a tela apagada e soma os minutos ao parar.','Site instalável com prévia das telas na instalação; testes de tela com auditoria de acessibilidade (axe-core).']],
 ['1.26.0',['Metrônomo com bateria simples (bumbo, caixa e chimbal), que segue o compasso e a subdivisão: quarta opção em Som do clique.','Sua batida: em Treinar, Batidas, monte uma batida própria; ela entra na lista, no tocar junto das músicas e em Meu treino.','No computador, atalhos de teclado: 1 a 7 trocam de aba, espaço liga e desliga o metrônomo ou o tocar junto, setas mudam o BPM e Esc sai do palco.','Afinador: Lá de referência ajustável (436 a 444 Hz); as notas do app acompanham.']],
 ['1.25.0',['Cifras chegam de outros apps: no menu Compartilhar do navegador ou do app de cifras, escolha o Violão Diário. O texto cai em Adicionar música com o nome e os acordes já preenchidos.','Ao colar uma cifra, o app anota os acordes sozinho; cada música ganhou o botão Compartilhar (nome, acordes e cifra como texto).','Modo palco: toque na cifra para pausar e retomar a rolagem.','Barra de baixo com os nomes das abas maiores.']],

 ['1.23.0',['Cópias automáticas do progresso dos últimos sete dias, com “Restaurar” em Perfil, Seus dados.','No app Android instalado pelo APK, aviso de versão nova com o link para baixar.','Evolução, Números: compartilhar uma imagem com sua sequência, minutos e nível.']],
 ['1.22.0',['Guia do iniciante em Teoria: segurar o violão, ler o diagrama, palheta ou dedos, dor nos dedos, cordas.','Cifra com os desenhos dos acordes da música no alto; músicas podem ser reordenadas.','Meta de dias por semana (Perfil), com o andamento em Hoje e uma conquista.','Metrônomo: som do clique (bipe, madeira, clave) e piscar a tela no tempo.']],

 ['1.18.0',['Cifra: modo palco (só a cifra, letra grande) e a tela fica acesa enquanto rola.','Hoje mais curto: prática livre, diário e gravação ficam numa linha recolhida.','Perfil: “Sobre e ajuda”, com como usar, privacidade e onde reportar problema.','No Android, links do site (treinos compartilhados, atalhos) abrem direto no app.']],
 ['1.17.0',['Roteiro com três níveis novos: ritmos brasileiros; baixos, power chords e pestanas móveis; cor, tom e ouvido.','Power chords E5, A5, D5, G5 e C5 na biblioteca.','Aquecimento com o exercício cromático tocado junto, casa por casa.','Treinar, Tempo: bater a batida na tela, célula por célula.']],
 ['1.16.0',['Perfis no mesmo aparelho (Perfil): cada pessoa com o próprio progresso.','Compartilhar um treino de Meu treino por link; quem abre recebe pronto.','Telas largas com mais colunas, folha de acordes para imprimir e ajustes de acessibilidade.']],
 ['1.15.0',['Lembrete que diz o treino da semana e some no dia em que a meta já foi batida; aviso de cópia de segurança a cada 30 dias.','Bloco de ritmo já começa com o metrônomo; “Desfazer” num bloco concluído sem querer.','Afinador: meio tom abaixo, Drop D e modo cromático com cents.','Gravação de 30 segundos em Hoje, para ouvir a evolução (fica só no aparelho).','Site instalado com atalhos e fonte embutida; metrônomo por vibração.']],
 ['1.14.0',['Batidas brasileiras: bossa nova, samba, xote e baião.','Metrônomo com compasso mudo, para treinar o pulso interno.','Escalas: tocar junto nota por nota, com a posição marcada no braço.','Revisão rápida: montar o acorde no diagrama.','Ouvido: cante a nota, com o microfone dizendo se chegou.']],
 ['1.13.0',['Cifra: toque num acorde para ver o desenho; mude o tom e o capotraste, com sugestão de casa.','Tocar junto com a cifra: o app toca os acordes da música com a batida escolhida e marca o acorde da vez.','“Treinar as trocas” monta um treino com os acordes da música.','Acordes com baixo (D/F#, C/G, G/B, Am/G, E/G#) e versões fáceis de F, Bm, F#m e Bb.']],
 ['1.12.0',['Conferir um acorde pelo som: o app diz que corda não soou (Acordes, e no treino de Hoje).','Modo canhoto (Perfil, Aparência): desenhos e braço espelhados.','Acordes suspensos (sus2, sus4, 7sus4) e add9, com a explicação em Teoria.','No Android, segure o ícone do app para abrir o afinador, o metrônomo ou as trocas.']],

const verCmp=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0);}return 0;};
function newsPanel(){
  if(!VER||!S.seenVer||S.seenVer===VER)return '';
  const items=[];NEWS.forEach(([v,list])=>{if(verCmp(v,S.seenVer)>0&&verCmp(v,VER)<=0)items.push(...list);});
  if(!items.length)return '';
  return '<section class="panel"><div class="between"><h3>Novidades da versão '+esc(VER)+'</h3><button class="link" style="padding:0;min-height:0" data-act="news-seen">Fechar</button></div><ul class="steps muted small">'+items.slice(0,6).map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></section>';
}

function render(){
  const pop=$('#cifpop');if(pop)pop.remove();
  document.body.classList.toggle('stage',!!(view==='evolucao'&&sub.evolucao==='musicas'&&SV.id&&SV.stage&&!SV.edit&&S.songs.some(s=>s.id===SV.id&&s.cifra)));
  try{$('#view').innerHTML=V[view]();}
  catch(e){logErr('tela '+view+': '+(e&&e.message||e));$('#view').innerHTML='<section class="panel"><h2>Algo deu errado nesta tela</h2><p class="sub">'+esc(String(e&&e.message||e))+'</p><p class="sub small" style="margin-top:8px">Seu progresso está salvo. Volte para Hoje ou recarregue o app; se continuar, copie o diagnóstico em Perfil (na barra de baixo) e me mande.</p><div class="acts"><button class="btn sm" data-act="nav" data-v="hoje">Ir para Hoje</button><button class="btn sm line" data-act="pwa-reload">Recarregar</button></div></section>';}
  $('#tabs').innerHTML=TABS.map(t=>'<button data-act="nav" data-v="'+t[0]+'"'+(view===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</button>').join('');
  mPaint();awakeSync();svSync();freeSync();checkBadges();
}
function goBack(){ // botão Voltar do Android e tecla Esc: fecha o que estiver por cima, uma coisa de cada vez; no fim volta para Hoje (no app, depois minimiza)
  const pop=$('#cifpop');if(pop){pop.remove();return true;}
  if(T.phase==='count'||T.phase==='run'){T.phase='idle';render();return true;}
  if(SV.stage){ACT['song-stage']();return true;}
  if(view==='evolucao'&&sub.evolucao==='musicas'&&SV.id){ACT['song-close']();return true;}
  if(view!=='hoje'){go('hoje');return true;}
  return false;
}
function go(v){grStop(true);if(SG.on)sgStop(true);if(TM.timer)tmStop();if(!(v==='ferramentas'&&sub.ferramentas==='afinador')||(MIC&&MIC.mode==='count'))micStop();if(T.phase==='count'||T.phase==='run')T.phase='idle';if(v!=='acordes'){CFI.pre=null;CFI.preDone=null;}if(MI.on)miStop(true);resetArmed=false;ceDelArmed=false;STO.armed=false;SV.delArmed=null;SV.undo=null;view=v;render();window.scrollTo(0,0);focusView();}
function focusView(){const h=$('#view h1')||$('#view h2');if(!h)return;if(!h.hasAttribute('tabindex'))h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(e){}} // ao trocar de aba, o leitor de tela começa pelo título da tela nova

const ACT={
  nav:el=>go(el.dataset.v),
  sub:el=>{const g=el.dataset.g;sub[g]=el.dataset.v;if(g==='acordes'&&sub[g]!=='acordes'&&MIC&&MIC.mode==='check')micStop();if(g==='evolucao'&&svPlaying())grStop(true);if(g==='ouvido'&&MIC&&MIC.mode==='sing')micStop();if(g==='treinar'){grStop(true);if(SG.on&&SG.kind==='mao')sgStop(true);if(MIC&&(MIC.mode==='count'||MIC.mode==='sing'))micStop();if(TM.timer){clearInterval(TM.timer);TM.timer=null;TM.phase='idle';}}if(g==='ferramentas'&&sub[g]!=='afinador')micStop();if(g==='ouvido')E.q=null;if(g==='treinar'&&(T.phase==='count'||T.phase==='run'))T.phase='idle';render();},
  'ob-level':el=>{ob.level=+el.dataset.v;render();},
  'ob-goal':el=>{ob.goal=+el.dataset.v;render();},
  'ob-quiz':()=>{ob.quiz=!ob.quiz;render();},
  'ob-qc':el=>{const c=el.dataset.v,i=ob.qc.indexOf(c);if(i>=0)ob.qc.splice(i,1);else ob.qc.push(c);render();},
  'ob-qb':el=>{ob.qb=el.dataset.v;render();},
  'ob-qt':el=>{ob.qt=el.dataset.v;render();},
  'ob-apply':el=>{ob.level=+el.dataset.v;ob.quiz=false;render();window.scrollTo(0,0);toast('Nível '+ob.level+' escolhido. Dá para mudar depois, em Perfil.');},
  'ob-go':()=>{S.level=ob.level;S.startLevel=ob.level;S.goal=ob.goal;S.levelSince=today();S.onboarded=true;S.seenVer=VER;S.welcomed=false;save();audio();render();},
  'welcome-done':()=>{S.welcomed=true;save();render();},

  sub.evolucao='musicas';go('evolucao');toast(cortada?'Cifra recebida, mas maior que 12 mil caracteres: o fim foi cortado.':'Cifra recebida. Confira o nome e os acordes.');
}
function openDeepLink(url){ // atalhos (app.violaodiario://afinador, ?ir=afinador), links do site que abrem no app (App Links): #treino=..., e texto compartilhado por outro app (app.violaodiario://musica?texto=..., ?texto=... no site instalado)
  url=String(url||'');
  if(/[?&](texto|titulo|link)=/.test(url)&&!/#treino=/.test(url)){const q=deepParams(url);receiveCifra(q.titulo,q.texto,q.link);return;}
  if(/#treino=/.test(url)){const t=parseTrain(url);if(!t)return;if(!S.custom.some(x=>trainCode(x)===trainCode(t))){S.custom.push(t);save();}ctMsg='Treino recebido: '+ctName(t)+'. Já está nos seus treinos.';if(S.onboarded)go('meu');else toast('Treino recebido. Monte seu perfil e ele estará em Meu treino.');return;}
  const m=/^[a-z.]+:\/\/([a-z]+)/i.exec(url),ir=/[?&]ir=([a-z]+)/i.exec(url);const p=ir?ir[1].toLowerCase():m?m[1].toLowerCase():'';if(!p||!S.onboarded)return;
  if(p==='afinador'){sub.ferramentas='afinador';go('ferramentas');}
  else if(p==='metronomo'){sub.ferramentas='metronomo';go('ferramentas');}
  else if(p==='trocas'){sub.treinar='trocas';go('treinar');}
  else if(p==='meu')go('meu');
}

{const ir=new URLSearchParams(location.search).get('ir');if(ir){openDeepLink('app://'+ir);try{history.replaceState(null,'',location.pathname);}catch(e){}}} // atalhos do site instalado (manifest.webmanifest)
{const q=new URLSearchParams(location.search);if(q.has('texto')||q.has('titulo')||q.has('link')){try{history.replaceState(null,'',location.pathname);}catch(e){}receiveCifra(q.get('titulo'),q.get('texto'),q.get('link'));}} // texto compartilhado com o site instalado (share_target do manifest.webmanifest)
{const hs=location.hash;if(/#treino=/.test(hs)){try{history.replaceState(null,'',location.pathname);}catch(e){}if(parseTrain(hs))openDeepLink(hs);else toast('O link de treino veio incompleto.');}} // link de treino compartilhado, aberto no site

if(NATIVE){
  const on=(plugin,ev,fn)=>{try{PLUG[plugin]&&PLUG[plugin].addListener(ev,fn);}catch(e){}};
  // Botão voltar do Android: encerra a contagem de trocas, depois volta para Hoje e, em Hoje, minimiza o app.
  on('App','backButton',()=>{if(!goBack())native('App','minimizeApp');});
  on('App','appStateChange',st=>{if(st&&st.isActive){onShow();checkNativeUpdate();}else onHide();});
  setTimeout(()=>checkNativeUpdate(),4000); // versão nova no GitHub, para quem instalou pelo APK
  // Atalhos do ícone (Android): abrem direto o afinador, o metrônomo ou as trocas, com o app fechado ou aberto.
  on('App','appUrlOpen',d=>{if(d&&d.url)openDeepLink(d.url);});
  const lu=native('App','getLaunchUrl');if(lu&&lu.then)lu.then(r=>{if(r&&r.url)openDeepLink(r.url);},()=>{});
  // Progresso: se o armazenamento da WebView veio vazio, recupera a cópia guardada pelo app.
  if(hadLocal)save();
  else{const p=native('Preferences','get',{key:KEY});if(p&&p.then)p.then(r=>{let o=null;try{o=r&&r.value?JSON.parse(r.value):null;}catch(e){}
    if(!o||typeof o!=='object'||S.onboarded)return;adopt(o);mSync();save();applyLook();render();});}
  scheduleReminder(); // garante o lembrete diário depois de reinstalar ou atualizar
  // Tira a tela de abertura quando a fonte embutida e a primeira tela estiverem prontas.
  const hide=()=>native('SplashScreen','hide');
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(hide,hide);
}
