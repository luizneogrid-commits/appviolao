<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violão Diário</title>
<meta name="app-version" content="1.57.0">
<meta name="description" content="Treino diário de violão: plano por nível, metrônomo, afinador, batidas para tocar junto, acordes e notas.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2EEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171014" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Violão Diário">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Fonte Archivo embutida (pasta fonts/): o site e o app abrem iguais, com ou sem internet, sem pedir nada ao Google Fonts. */
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/archivo-latin-wdth-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/archivo-latin-ext-wdth-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#F2EEF0; --surface:#FFFFFF; --surface-2:#F8F3F5; --ink:#24161D; --muted:#6E5C65; --line:#E0D6DB;
  --primary:#7A2E4D; --on-primary:#FFFFFF; --primary-soft:#F1E1E8;
  --brass:#C98A1B; --brass-soft:#F3E3C2; --ok:#2F7D6B; --ok-soft:#DCEFE9;--ok-ink:#25655A; --warn:#B5382A;
  /* áreas do entalhe e da barra de gestos; no app Android, WebViews antigas recebem --safe-area-inset-* do Capacitor */
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
  --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  box-sizing:border-box;
  padding-top:var(--sat);
  padding-bottom:var(--sab);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171014; --surface:#22181D; --surface-2:#2B1F25; --ink:#F3EAEE; --muted:#A99AA2; --line:#3A2B32;
    --primary:#E38FB0; --on-primary:#2A0F1B; --primary-soft:#3A2230;
    --brass:#E9B44C; --brass-soft:#44361A; --ok:#5CC2A8; --ok-soft:#1C3A33;--ok-ink:#5CC2A8; --warn:#F08A7B;
  }
}
:root[data-theme="dark"]{
  --bg:#171014; --surface:#22181D; --surface-2:#2B1F25; --ink:#F3EAEE; --muted:#A99AA2; --line:#3A2B32;
  --primary:#E38FB0; --on-primary:#2A0F1B; --primary-soft:#3A2230;
  --brass:#E9B44C; --brass-soft:#44361A; --ok:#5CC2A8; --ok-soft:#1C3A33;--ok-ink:#5CC2A8; --warn:#F08A7B;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:var(--sat);-webkit-text-size-adjust:100%;font-size:16px}
html.f1{font-size:17.5px}html.f2{font-size:19px} /* letra maior, escolhida em Perfil: tudo em rem acompanha */
body{background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* faixa atrás da barra de status: o conteúdo rola por baixo dela sem encostar no relógio e na bateria */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:7}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:22px 18px 120px}
#snd-wrap[hidden],#upd-wrap[hidden]{display:none}
.steps{padding-left:1.25em;line-height:1.6;margin-top:10px}
.steps li+li{margin-top:4px}

/* type */
h1{font-stretch:125%;font-weight:800;font-size:2.1rem;letter-spacing:-.02em;line-height:1.05}
h2{font-stretch:112%;font-weight:750;font-size:1.2rem;letter-spacing:-.01em;line-height:1.2}
h3{font-weight:700;font-size:1.02rem;line-height:1.25}
.sub{color:var(--muted);margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-stretch:62%;font-weight:800;font-variant-numeric:tabular-nums;line-height:.9;letter-spacing:-.01em}

/* layout pieces */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.streak{display:flex;align-items:center;gap:8px;text-align:left}
.streak .num{font-size:3.4rem;color:var(--primary)}
.streak .lbl{font-size:.8rem;line-height:1.15;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.panel + .panel{margin-top:14px}
.stack > * + *{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* buttons */
.btn{border:0;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:700;padding:0 22px;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.quiet{background:var(--primary-soft);color:var(--primary)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:42px;padding:0 16px;font-size:.92rem}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
.link{background:none;border:0;color:var(--primary);font-weight:650;text-decoration:underline;text-underline-offset:3px;padding:10px 0;min-height:42px}
.acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:0 14px;min-height:42px;font-weight:650;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;min-height:42px;padding:0 6px;border-radius:999px;font-weight:650;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg.tight button{padding:0 2px;font-stretch:86%;line-height:1.15}

/* week neck */
.neck{margin:0 -4px 18px}
.neck svg{display:block;width:100%;height:auto}
.neck .wood{fill:var(--surface)}
.neck .str{stroke:var(--muted);opacity:.75}
.neck .fret{stroke:var(--brass);stroke-width:2.5}
.neck .nut{fill:var(--ink)}
.neck .dot-full{fill:var(--brass)}
.neck .dot-part{fill:var(--brass-soft);stroke:var(--brass);stroke-width:2}
.neck .dot-today{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:4 4}
.neck text{font-size:11px;fill:var(--muted);font-weight:600;text-anchor:middle}
.neck text.today{fill:var(--ink);font-weight:800}
@keyframes pluck{0%,100%{transform:translateY(0)}15%{transform:translateY(-1.6px)}35%{transform:translateY(1.3px)}55%{transform:translateY(-.9px)}75%{transform:translateY(.5px)}}
.neck.ring .str{animation:pluck .5s ease-out 2;transform-box:fill-box}
.neck.ring .str:nth-of-type(2){animation-delay:.04s}.neck.ring .str:nth-of-type(3){animation-delay:.08s}
.neck.ring .str:nth-of-type(4){animation-delay:.12s}.neck.ring .str:nth-of-type(5){animation-delay:.16s}.neck.ring .str:nth-of-type(6){animation-delay:.2s}
@media (prefers-reduced-motion: reduce){.neck.ring .str{animation:none}.btn:active{transform:none}.toast{transition:none}.lvl i{transition:none}html{scroll-behavior:auto}}

/* plan */
.blocks{list-style:none;counter-reset:b}
.blk{counter-increment:b;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:6px}
.blk::before{content:counter(b);width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:750;color:var(--muted);font-size:.95rem}
.blk.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--surface)}
.blk.active::before{border-color:var(--primary);color:var(--primary)}
.blk.done p,.blk.done .extra{display:none}
.blk.done h3{color:var(--muted)}
.blk p{margin-top:6px;color:var(--muted)}
.blk .mins{color:var(--muted);font-weight:600;font-size:.9rem;white-space:nowrap}
.blk .acts{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.timer{font-size:4.2rem;color:var(--primary);margin-top:12px}
.extra{margin-top:12px}

/* rhythm grid */
.rhy{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:320px}
.rhy div{background:var(--surface-2);border-radius:8px;text-align:center;padding:6px 0 4px}
.rhy b{display:block;font-size:1.3rem;line-height:1.1;min-height:1.45rem;color:var(--ink)}
.rhy span{font-size:.72rem;color:var(--muted);font-weight:600}
.rhy div.on{background:var(--primary-soft)}
.rhy div.now{background:var(--brass-soft);box-shadow:inset 0 0 0 2px var(--brass)}
.rhy div.good{background:var(--ok-soft)}.rhy div.mid{background:var(--brass-soft)}.rhy div.bad{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--warn)}.rhy div.miss{opacity:.5} /* resultado do "bater a batida" */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.progrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.progrow>span{flex:1 1 60px;min-width:60px;text-align:center;border-radius:12px;background:var(--surface-2);padding:10px 4px;font-stretch:75%;font-weight:800;font-size:1.5rem;line-height:1}
.progrow>span.now{background:var(--brass-soft);color:var(--primary);box-shadow:inset 0 0 0 3px var(--primary)}
.progrow>span .chord{display:block;margin-top:6px}.progrow>span .chord svg{width:100%;max-width:96px;height:auto;margin:0 auto;display:block} /* desenho do acorde embaixo do nome */
.bpmrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.bpmrow .num{font-size:2.6rem}
.bpmrow button{width:56px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:750}
/* notes */
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scale button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale b{font-stretch:75%;font-size:1.8rem;font-weight:800;line-height:1}
.scale span{font-size:.8rem;font-weight:700}
.scale small{font-size:.68rem;color:var(--muted);font-weight:600;line-height:1.2;text-align:center}
.scale button.hit,.scale button:active{border-color:var(--brass);background:var(--brass-soft)}
.fbwrap{overflow-x:auto;margin:14px -18px 0;padding:0 18px 8px}
.fb{display:grid;grid-template-columns:26px 46px repeat(12,48px);width:max-content}
.fb .hd{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center;padding-bottom:6px}
.fb .hd.mk{color:var(--ink)}
.fb .sl{font-size:.72rem;font-weight:700;color:var(--muted);display:grid;place-items:center}
.fb button{height:44px;border:0;border-right:2px solid var(--brass);background:linear-gradient(var(--muted),var(--muted)) center/100% 1.5px no-repeat;display:grid;place-items:center;padding:0}
.fb button.open{border-right:5px solid var(--ink)}
.fb button i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82rem;background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.fb button.sharp i{width:12px;height:12px;font-size:0;background:var(--line);border:0}
.fb.all button.sharp i{width:32px;height:32px;font-size:.72rem;background:var(--surface-2);border:1.5px solid var(--line);color:var(--muted)}
.fb button.hit i{background:var(--primary);border-color:var(--primary);color:var(--on-primary);width:32px;height:32px;font-size:.78rem}
.fb.lefty{direction:rtl}.fb.lefty button{border-right:0;border-left:2px solid var(--brass)}.fb.lefty button.open{border-left:5px solid var(--ink)} /* canhoto: pestana à direita */
.chkrow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:start;margin-top:12px}.chkrow .chord svg{width:118px}
.fbinfo{min-height:3em;margin-top:10px;font-weight:650}

/* chords */
.chord svg{display:block;width:100%;height:auto}
.chord .g{stroke:var(--muted);stroke-width:1.2;opacity:.8}
.chord .nutc{fill:var(--ink)}
.chord .fd{fill:var(--primary)}
.chord .ft{fill:var(--on-primary);font-size:10px;font-weight:800;text-anchor:middle}
.chord .mk{fill:var(--muted);font-size:11px;font-weight:700;text-anchor:middle}
.chord .bf{fill:var(--muted);font-size:10px;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ctile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.ctile .play{background:none;border:0;text-align:left;border-radius:12px}
.ctile .name{font-stretch:75%;font-weight:800;font-size:1.9rem;line-height:1}
.st{border:0;border-radius:10px;min-height:44px;font-weight:700;font-size:.85rem;background:var(--surface-2);color:var(--muted)}
.st[data-s="aprendendo"]{background:var(--brass-soft);color:var(--ink)}
.st[data-s="dominado"]{background:var(--ok);color:var(--surface)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:260px}
.pair .chord.play{background:none;border:0;padding:0;text-align:center;border-radius:12px}
.acpair .chord{border-radius:14px;padding:8px 4px 2px;border:2px solid transparent}
.acpair .chord.hit{border-color:var(--ok);background:var(--ok-soft)}
.lvl{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:12px auto 6px;max-width:220px}
.lvl i{display:block;height:100%;background:var(--ok);width:0;transition:width .08s linear}
.pair .chord{text-align:center}
.pair .chord strong{font-stretch:75%;font-size:1.3rem}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.filters .chip{white-space:nowrap;flex:none}

/* metronome */
.metro{text-align:center}
.metro .bpm{font-size:8.5rem;color:var(--ink)}
.metro .bpm-l{color:var(--muted);font-weight:650;margin-top:2px}
.dots{display:flex;justify-content:center;gap:10px;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:transform .05s}
.dots i.on{background:var(--brass);transform:scale(1.35)}
.dots i.first.on{background:var(--primary)}
.stepper{display:flex;justify-content:center;gap:8px;margin:14px 0}
.stepper button{width:56px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:750}
input[type=range]{width:100%;accent-color:var(--primary);min-height:36px}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
.field input[type=number]{width:64px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);text-align:center;font-weight:700;color:var(--ink)}
.snd{background:var(--brass-soft);border:1.5px solid var(--brass);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.snd p{font-weight:650;margin-bottom:10px}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sab));background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px 6px 18px;display:none;align-items:center;gap:12px;font-weight:650;font-size:.92rem;z-index:5;white-space:nowrap}
.pill.show{display:flex}
.pill button{border:0;border-radius:999px;background:var(--bg);color:var(--ink);min-height:36px;padding:0 14px;font-weight:750}

/* tuner */
.heads{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.heads button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.heads button:active,.heads button.hit{border-color:var(--brass);background:var(--brass-soft)}
.heads b{font-stretch:75%;font-size:1.7rem;font-weight:800;line-height:1}
.heads span{font-size:.72rem;color:var(--muted);font-weight:600}
.meter{position:relative;height:46px;margin:18px 0 8px;border-radius:12px;background:var(--surface-2);overflow:hidden}
.meter::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12%;transform:translateX(-50%);background:var(--ok);opacity:.22}
.meter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ok)}
.needle{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--ink);left:50%;transform:translateX(-50%);transition:left .12s linear;z-index:1}
.tnote{font-size:4.4rem;text-align:center}

/* changes */
.tap{width:100%;border:0;border-radius:24px;background:var(--primary);color:var(--on-primary);padding:26px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
.tap .num{font-size:9rem}
.tap:active{filter:brightness(1.08)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--brass);width:100%}
select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 12px;font-weight:700;min-width:96px}
.big{font-size:6rem;text-align:center;color:var(--primary)}
.hist{list-style:none}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist svg{width:90px;height:28px;flex:none}
.hist polyline{fill:none;stroke:var(--brass);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ear */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}
.opt{min-height:58px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:750;font-size:1.1rem}
.opt.right{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--warn);color:var(--warn)}
.opt.small{font-size:.92rem;padding:6px 8px}
.opt:disabled{cursor:default}
.blk .fb{gap:6px 10px}
.why{margin-top:4px}.why summary{list-style:none;cursor:pointer;font-size:.85rem;font-weight:650;color:var(--primary);min-height:32px;display:flex;align-items:center}.why summary::-webkit-details-marker{display:none}.why p{margin-top:0;font-size:.9rem}
textarea.inp{padding:10px 14px;min-height:96px;resize:vertical;line-height:1.4;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.cifra{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;line-height:1.55;margin-top:12px;padding-bottom:40vh}
.cifra.big{font-size:1.15rem}
/* modo palco: só a cifra, letra maior, sem barras nem cabeçalho */
body.stage .tabs,body.stage .pill,body.stage header.top,body.stage .seg{display:none}body.stage .app{padding:10px 14px 24px}body.stage .stagebar{border:0;background:transparent;padding:0}body.stage .cifra{font-size:1.25rem;line-height:1.6}body.stage .cifra.big{font-size:1.6rem}
.tcard .panel{border:0;border-radius:0;padding:12px 0 4px;border-top:1px solid var(--line)}.tcard .panel:first-child{border-top:0;padding-top:4px}
.cif-ch{font:inherit;font-weight:800;color:var(--primary);background:var(--primary-soft);border:0;border-radius:6px;padding:0 4px;cursor:pointer}
.cifra.lyrics .cl,.cifra.lyrics .cif-ch{display:none}.cif-ch.hid{background:var(--surface-2);color:var(--muted);min-width:1.8em}
.blocks .part{list-style:none;margin:6px 0 2px;padding:0}.blocks .part::before{display:none}
.prebox{width:118px;height:130px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;color:var(--muted);background:var(--surface-2);border-radius:12px;margin:6px auto 0} /* desenho escondido do acorde novo (palpite) */.cifra .cif-tab{display:inline-block;max-width:100%;overflow-x:auto;white-space:pre;vertical-align:top} /* só a letra; tablatura rola de lado sem quebrar */
.cif-ch.off{background:none;color:var(--muted);font-weight:700;cursor:default}.cif-ch.now{background:var(--primary);color:var(--on-primary)}
.cifpop{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,360px);background:var(--surface);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px 14px;z-index:40;display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center}
.cifpop .chord svg{width:104px;display:block}.cifpop .acts{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.svplay{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.svtom{margin-top:10px}.svtom b{min-width:28px;text-align:center;display:inline-block}
.tm-last.good{color:var(--ok)}.tm-last.mid{color:var(--brass)}.tm-last.bad{color:var(--warn)}
.tmdots{position:relative;height:28px;margin:14px 0 6px;background:var(--surface-2);border-radius:8px}
.tmdots i{position:absolute;top:8px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%)}
.tmdots i.good{background:var(--ok)}.tmdots i.mid{background:var(--brass)}.tmdots i.bad{background:var(--warn)}
.tmdots b{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.chart svg.heat{display:block;width:560px;max-width:none;height:auto;margin-top:12px}
.chart .heat text,.chart .heatl text{font-size:10px;fill:var(--muted);font-weight:700;text-anchor:start} /* mais específico que .chart text, que centraliza: aqui os rótulos começam na posição */
.heatrow{display:flex;align-items:flex-start;margin-top:14px}.heatrow .fbwrap{flex:1;min-width:0;margin:0 -18px 0 0;padding:0 18px 8px 4px}.heatl{display:block;flex:none;height:auto;margin-top:12px} /* rótulos das linhas fora da área que rola */
.heat .h0{fill:var(--line)}.heat .h1{fill:var(--brass-soft)}.heat .h2{fill:var(--brass)}.heat .h3{fill:var(--primary)}
.blk .fb .chip{min-height:36px;padding:0 12px;font-size:.85rem}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stats div{background:var(--surface);padding:16px}
.stats .num{font-size:2.8rem;display:block}
.stats span{color:var(--muted);font-size:.88rem;font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.chart .b{fill:var(--primary)}
.chart .b0{fill:var(--line)}
.chart .goal{stroke:var(--brass);stroke-width:1.5;stroke-dasharray:4 4}
.chart text{font-size:10px;fill:var(--muted);text-anchor:middle;font-weight:600}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv b{font-weight:750;text-align:right}

/* path */
.lvl{border-top:1px solid var(--line);padding:16px 0}
.lvl:first-child{border-top:0;padding-top:0}
.lvl .tag{font-size:.8rem;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:8px;padding:3px 8px}
.skill{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:10px 0;min-height:44px}
.skill i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem;color:transparent;margin-top:1px}
.skill[aria-pressed="true"] i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.skill[aria-pressed="true"] span{color:var(--muted)}
.skill.proven i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.skill small{display:block;font-weight:600;font-size:.8rem;margin-top:3px}
.skill small.tag{display:inline-block;font-size:.72rem;font-weight:700}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%) translateY(-8px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-weight:650;font-size:.92rem;z-index:8;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.badge{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px} /* conquista por vir: borda tracejada, sem opacidade, para o texto ter contraste */
.badge.got{border-style:solid;border-color:var(--brass);background:var(--brass-soft)}.badge.got span,.badge.got small{color:var(--ink)} /* no tema escuro, o cinza sobre o fundo dourado não tinha contraste */
.badge b{display:block;font-size:.95rem}
.badge span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.badge small{display:block;font-size:.75rem;color:var(--muted);margin-top:4px;font-weight:700}

/* songs */
.inp{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 14px;color:var(--ink)} /* a cor do texto acompanha o tema (no escuro, o padrão do navegador é preto) */
.song{padding:14px 0;border-top:1px solid var(--line)}
.song:first-child{border-top:0}
.song .cif{color:var(--muted);font-weight:600;margin-top:2px;word-break:break-word}

/* teoria */
.thname{font-stretch:75%;font-size:2.4rem;font-weight:800;line-height:1}
.thdiag{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;max-width:330px}
.thdiag .chord{text-align:center}
.thdiag .chord>span{display:block;margin-bottom:2px}
.thform{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.rb{display:inline-block;min-width:32px;text-align:center;border-radius:8px;padding:2px 6px;font-size:.8rem;font-weight:800;border:1.5px solid transparent;line-height:1.3}
.rb.rT{background:var(--primary);color:var(--on-primary)}
.rb.r3{background:var(--brass-soft);border-color:var(--brass);color:var(--ink)}
.rb.r5{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.rb.r7{background:var(--surface-2);border-color:var(--ink);color:var(--ink)}
.chord .rd.rT{fill:var(--primary)}.chord .rd.r3{fill:var(--brass)}.chord .rd.r5{fill:var(--ok)}.chord .rd.r7{fill:var(--ink)}
.chord .rl{font-size:7.5px;font-weight:800;text-anchor:middle;fill:var(--surface)}
.chord .rl.l3{fill:#24161D}
.chord .bar0{fill:var(--line)}
.chord .nn{font-size:9.5px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.ruler{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:14px}
.ruler>*{background:var(--surface-2);border-radius:6px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0;gap:2px;min-width:0;border:0;color:inherit}
.ruler button:active{filter:brightness(1.1)}
.ruler span{font-size:.62rem;color:var(--muted);font-weight:700}
.ruler b{font-size:.72rem;font-weight:800;font-stretch:72%;line-height:1.1}
.ruler i{font-style:normal;font-size:.6rem;font-weight:800}
.ruler .rT{background:var(--primary);color:var(--on-primary)}
.ruler .rT span{color:inherit}
.ruler .r3{background:var(--brass-soft);box-shadow:inset 0 0 0 1.5px var(--brass)}
.ruler .r5{background:var(--ok-soft);box-shadow:inset 0 0 0 1.5px var(--ok)}
.ruler .r7{box-shadow:inset 0 0 0 1.5px var(--ink)}
.srows{list-style:none;margin-top:6px}
.srow{display:grid;grid-template-columns:74px 1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;-webkit-user-select:text;user-select:text}
.srows li:first-child .srow{border-top:0}
.srow .sn{font-weight:750;font-size:.9rem;line-height:1.2}
.srow .sn small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.srow .res{font-weight:750}
.srow .why{grid-column:1/-1;color:var(--muted);font-size:.9rem;line-height:1.45}
.thwhy p{color:var(--muted);margin-top:10px}
.thwhy p b{color:var(--ink)}
.thcmp{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.thcmp p{color:var(--muted);margin-bottom:4px}
.thcmp .pair{margin:6px 0 12px}
.thcmp .pair .btn{margin-top:6px}
.chord .hl{fill:none;stroke:var(--brass);stroke-width:2.2;stroke-dasharray:3 2.5}
.ivl-row{border-top:1px solid var(--line);padding:10px 0}
.ivl-row:first-child{border-top:0}
span.chip{display:inline-flex;align-items:center;gap:4px}
.cf{display:block;width:100%;max-width:360px;margin:12px auto 0;height:auto}
.cf .maj,.cf .min{stroke:var(--surface);stroke-width:1.5}
.cf .zero .maj{fill:var(--surface-2)}.cf .shp .maj{fill:var(--primary-soft)}.cf .flt .maj{fill:var(--brass-soft)}.cf .both .maj{fill:var(--line)}
.cf .min{fill:var(--ok-soft)}
.cf .mt{font-size:13px;font-weight:800;fill:var(--ink);text-anchor:middle}
.cf .nt{font-size:10px;font-weight:700;fill:var(--ink);text-anchor:middle}
.cf .st,.cf .ct{font-size:9px;font-weight:700;fill:var(--muted);text-anchor:middle}
.cf .cfk{cursor:pointer;outline:none}
.cf .cfk:focus-visible .maj{stroke:var(--brass);stroke-width:3}
.cf .on .maj{fill:var(--primary)}.cf .on .mt{fill:var(--on-primary)}
.cf .on .min{fill:var(--ok)}.cf .on .nt{fill:var(--surface)}
.cflegend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.8rem;color:var(--muted);margin-top:8px}
.cflegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cflegend .l1{background:var(--primary-soft)}.cflegend .l2{background:var(--brass-soft)}.cflegend .l3{background:var(--ok-soft)}.cflegend .l4{background:var(--surface-2);border:1px solid var(--line)}
.chip small{font-size:.72rem;color:var(--muted);font-weight:700}
.chip.on small{color:inherit;opacity:.85}
.chip.off{display:inline-flex;align-items:center;gap:4px;border-style:dashed} /* sem opacidade: o contraste do texto continua legível (auditoria de acessibilidade) */
.sfb .g{stroke:var(--muted);stroke-width:1;opacity:.6}
.sfb .nutc{fill:var(--ink)}
.sfb .fh,.sfb .sl{font-size:9px;fill:var(--muted);font-weight:700;text-anchor:middle}
.sfb .fh.mk{fill:var(--ink)}
.sfb .sroot{fill:var(--primary)}
.sfb .snote{fill:var(--surface);stroke:var(--brass);stroke-width:1.5}
.sfb .srt{fill:var(--on-primary);font-size:7px;font-weight:800;text-anchor:middle}
.sfb .snt{fill:var(--ink);font-size:7px;font-weight:800;text-anchor:middle}
.sfb .sgbox{fill:var(--brass);opacity:.16}.sfb .snote.on{fill:var(--brass)}.sfb .sroot.on{fill:var(--ink)}
.build rect.cell{fill:#fff;fill-opacity:0;cursor:pointer}.build .open{fill:var(--muted);font-size:11px;font-weight:700;text-anchor:middle}
.thcmp p b{color:var(--ink)}
.tcard{border-top:1px solid var(--line)}
.tcard:first-child{border-top:0}
.tcard summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:750;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tcard summary::-webkit-details-marker{display:none}
.tcard summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--primary);font-weight:700}
.tcard[open] summary::after{content:"−"}
.tcard>div{padding:0 0 16px;color:var(--muted)}
.tcard p+p{margin-top:8px}
.tcard .acts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.tcard .kv{align-items:center}
.ctile .thlink{padding:0;min-height:36px;font-size:.85rem;text-align:center}

/* meu treino */
.seq{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;min-height:42px;align-items:center}
.chip.on{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.btn:disabled,.chip:disabled{opacity:.45;cursor:default}
.grp{font-size:.8rem;font-weight:700;color:var(--muted);margin:16px 0 8px}
.cmini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.cmini .chord{border:0;background:none;padding:0;text-align:center;border-radius:12px}
.cmini strong{font-stretch:75%;font-size:1.1rem}
.cmini.hf .deg{display:block;font-size:.8rem;font-weight:800;color:var(--primary)}.cmini.hf .fn{display:block;font-size:.72rem;font-weight:650;margin-top:2px}.cmini.hf .nosh{display:block;padding:26px 0 24px} /* campo harmônico: grau em cima, função embaixo */
.patprev{margin-top:14px}
.patprev>b{display:block;font-size:.9rem;margin-bottom:6px}
.ct .acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.cs-pair{margin-top:14px}
.cs-pair .chord{border-radius:14px;padding:8px 8px 2px}
.cs-pair .chord:first-child{background:var(--primary-soft)}
.cs-pair .chord>span{display:block}

/* roteiro */
.road-now h3{font-size:.95rem}
.tag.done{color:var(--ok-ink,var(--ok));background:var(--ok-soft)}
.road-lvl{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-top:14px}
.road-lvl.cur{border-color:var(--primary)}
.road-lvl summary{cursor:pointer;list-style:none;display:block}
.road-lvl summary::-webkit-details-marker{display:none}
.rl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rl-head::after{content:"+";font-size:1.4rem;line-height:1;color:var(--primary);font-weight:700;margin-left:auto}
.road-lvl[open] .rl-head::after{content:"−"}
.rl-head .tag,.rl-head .muted{white-space:nowrap}
.rl-desc{display:block;margin-top:4px}
.road-weeks{margin-top:8px}
.road-wk{border-top:1px solid var(--line);padding:14px 0}
.road-wk.now{background:var(--primary-soft);margin:0 -18px;padding:14px 18px;border-radius:12px;border-top:0}
.road-wk.now+.road-wk{border-top:0}
.road-hd{display:flex;gap:10px;align-items:flex-start}
.road-hd .wk{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:750;font-size:.85rem;color:var(--muted)}
.road-wk.ok .wk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.road-wk.now .wk{border-color:var(--primary);color:var(--primary)}
.road-hd .tag{display:inline-block;margin-top:5px}
.road-list{list-style:none;margin-top:6px;color:var(--muted);font-size:.9rem;line-height:1.45}
.road-list li+li{margin-top:4px}
.road-list b{color:var(--ink);font-weight:700}
.road-ch{margin-top:10px}
.road-ch .chip{min-height:40px;padding:0 10px;font-size:.85rem}
.road-wk .acts{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.choices{display:grid;gap:8px;margin-top:12px}

/* onboarding */
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;min-height:56px}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.choice b{display:block}
.choice span{color:var(--muted);font-size:.9rem}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:6}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr} /* uma coluna por aba, quantas houver em TABS */
.tabs button{border:0;background:none;padding:9px 1px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:650;font-stretch:82%;white-space:nowrap;color:var(--muted);min-height:60px;min-width:0}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--primary)}
/* lado direito do cabeçalho (a sequência, em Hoje); índice das seções do perfil; sete abas na barra de baixo */
.topr{display:flex;align-items:flex-end;gap:10px;flex:none}
.pfidx{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}.pfidx .chip{white-space:nowrap;flex:none}
body.flash::after{content:"";position:fixed;inset:0;background:var(--brass);opacity:.35;pointer-events:none;z-index:9} /* metrônomo: piscar a tela no tempo */
.rhy.edit div{cursor:pointer} /* editor de batida própria: cada casa é um botão */
.cfg{display:grid;grid-template-columns:38px repeat(6,1fr);gap:4px;max-width:360px;margin-top:12px} /* identificador de acordes: diagrama para marcar */
.cfg .hd,.cfg .sl{font-size:.72rem;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;min-height:36px}
.cfg button{min-height:40px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;color:var(--ink);font-size:1rem}
.cfg button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cdiag{width:118px;flex:none;margin-left:10px}
.vol{display:grid;grid-template-columns:118px 1fr 52px;align-items:center;gap:8px;margin-top:6px}.vol b{text-align:right} /* volumes em Perfil, Som */
.cif-ch.sel{box-shadow:0 0 0 2px var(--brass)} /* trecho em loop marcado na cifra */
.cif-sec{display:inline-block;font-weight:800;color:var(--primary);margin-top:6px} /* seções da cifra */
#view h1[tabindex]:focus:not(:focus-visible),#view h2[tabindex]:focus:not(:focus-visible){outline:none} /* foco programático no título: sem anel para quem usa o toque ou o mouse */
.tbar{display:block;height:8px;border-radius:4px;background:var(--primary);margin-top:4px} /* onde vai o tempo */
.panel.chal{cursor:pointer}.panel.chal:active{background:var(--surface-2)} /* o painel do desafio é um atalho */
.panel[role=button]:active,.kv[role=button]:active,.neck[role=button]:active{background:var(--surface-2)} /* painéis e linhas que são atalhos */
.tguide ol{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tguide li{border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:.9rem}.tguide li.now{border-color:var(--brass);background:var(--brass-soft)}.tguide li.ok{border-color:var(--ok);background:var(--ok-soft)} /* afinação guiada */
.fb button.right i{background:var(--ok);border-color:var(--ok);color:#fff}.fb button.wrong i{border-color:var(--warn);color:var(--warn)} /* ouvido, Braço: posições certas e a errada */
.tabs button{font-size:.76rem;font-stretch:75%;padding-left:0;padding-right:0} /* nomes maiores: medidos com a fonte Archivo, o nome mais longo (Ferramentas) cabe na coluna com folga em cada faixa de largura */
@media (min-width:480px){.tabs button{font-size:.82rem;font-stretch:80%}}
@media (max-width:429px){.tabs button{font-size:.72rem;font-stretch:70%}}
@media (max-width:389px){.tabs button{font-size:.64rem;font-stretch:70%}}
@media (max-width:350px){.tabs button{font-size:.58rem;font-stretch:70%}}
/* telas largas (tablet, computador): a mesma coluna, um pouco mais larga, e grades com mais colunas (fica no fim para vencer as regras acima) */
@media (min-width:700px){.app{max-width:760px}.cgrid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.thdiag{max-width:420px}.pair{max-width:320px}.tabs button{font-size:.9rem;font-stretch:85%}}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60);};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- app nativo (Android e iOS, via Capacitor) ---------- */
// No app instalado pela loja/APK, o Capacitor injeta window.Capacitor com os plugins nativos. No navegador, nada disso existe.
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()),PLUG=(NATIVE&&CAP.Plugins)||{};

const buzz=ms=>{if(NATIVE){if(ms<30)native('Haptics','impact',{style:'LIGHT'});else native('Haptics','notification',{type:'SUCCESS'});return;}try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

/* ---------- state ---------- */
// Perfis no mesmo aparelho: o principal usa a chave de sempre; os outros, a chave com o sufixo do perfil.
// O registro (lista e perfil atual) fica fora do progresso; trocar de perfil recarrega o app.
const KEY_BASE='violao-diario-v1',PROF=(()=>{try{const p=JSON.parse(localStorage.getItem('violao-diario-perfis')||'null');if(p&&Array.isArray(p.list))return {list:p.list.filter(x=>x&&x.id&&x.name),current:typeof p.current==='string'?p.current:''};}catch(e){}return {list:[],current:''};})();
if(PROF.current&&!PROF.list.some(p=>p.id===PROF.current))PROF.current='';
function profSave(){try{localStorage.setItem('violao-diario-perfis',JSON.stringify(PROF));}catch(e){}}
const KEY=KEY_BASE+(PROF.current?'-p-'+PROF.current:'');
// Violões do app: os parâmetros da corda simulada (Karplus-Strong) e da "caixa" por tipo. exc: quanto a excitação é
// abafada (0 a 1); pick: posição da palheta (fração do comprimento da corda); w: peso do filtro do laço (0,5 = média
// simples; maior = mais brilho); dark: mistura com uma média de três pontos (mais escuro); decay: ganho por volta da
// corda; body: filtros da caixa [tipo, Hz, Q, dB]; detune: duas cordas levemente dessintonizadas (aço).
const GUITARS={
  nylon:{name:'Nylon',desc:'Cordas de nylon e caixa acústica: o violão clássico, o da roda de samba e o da bossa.',exc:.72,pick:.2,w:.5,dark:.55,decay:.9955,body:[['peaking',95,4,6],['peaking',215,5,4],['highshelf',3200,0,-7]],gain:.8,detune:0,room:.14,sgain:1},
  aco:{name:'Aço (folk)',desc:'Cordas de aço, mais brilho e sustentação: o violão folk.',exc:.35,pick:.13,w:.5,dark:0,decay:.9982,body:[['peaking',100,4,4],['peaking',235,5,3],['highshelf',3500,0,2]],gain:.7,detune:.0018,room:.12,sgain:.9},
  eletrico:{name:'Elétrico limpo',desc:'Guitarra com som limpo: palheta perto do cavalete e sustentação longa.',exc:.2,pick:.08,w:.7,dark:0,decay:.9992,body:[['lowpass',4200,.7,0],['peaking',2400,1.2,2]],gain:.85,detune:0,room:.1,sgain:.9}
}; // room: quanto de sala (reverberação curta) nas vozes de violão; sgain: volume das amostras gravadas
const DEF={v:1,onboarded:false,name:'',level:1,levelSince:'',goal:15,cntMode:'tap',skills:{},days:{},changes:{},chords:{},songs:[],custom:[],ctLog:{},stats:{tuned:0,play:{},prog4:false},proven:{},badges:{},rest:0,startLevel:0,lastWeekSeen:'',lastMonthSeen:'',interleave:'',pre:{},intent:{after:'',place:''},split:false,remind2:'',chkLog:{},chkEst:true,rev:{},adj:null,quick:'',remind:'',bpmLog:{},font:0,theme:'',seenVer:'',msub:1,macc:'first',mgap:0,mvib:false,tuning:'padrao',tuneMode:'cordas',lastExport:'',backupAsk:'',recs:[],hojeMore:false,guitar:'nylon',welcomed:false,wgoal:0,mclick:'beep',mflash:false,updSeen:'',lefty:false,easyOn:{},ear:{ok:0,total:0},maxBpm:0,bpm:70,beats:4,altOut:false,installDismissed:false,a4:440,mypats:[],earLog:{},freeStart:0,volGuitar:100,volClick:100,mychords:[],remindLate:false,earLvl:{ivl:1,qual:1},earRun:{},recSecs:30,chal:null,chalLog:{},grVib:false};
let S,hadLocal=false;
const MP_CELLS=['','↓','↑','x','B']; // casas possíveis numa batida da pessoa (Treinar, Batidas, "Sua batida")
function adopt(o){
  S=Object.assign(JSON.parse(JSON.stringify(DEF)),o&&typeof o==='object'?o:{});
  ['skills','days','changes','chords'].forEach(k=>{if(!S[k]||typeof S[k]!=='object')S[k]={};});
  if(!Array.isArray(S.songs))S.songs=[];
  S.custom=Array.isArray(S.custom)?S.custom.filter(t=>t&&typeof t==='object'&&Array.isArray(t.chords)&&Array.isArray(t.pats)):[];
  if(!S.ctLog||typeof S.ctLog!=='object'||Array.isArray(S.ctLog))S.ctLog={};
  S.name=typeof S.name==='string'?S.name.slice(0,30):'';S.levelSince=typeof S.levelSince==='string'?S.levelSince:'';S.cntMode=S.cntMode==='mic'?'mic':'tap';
  if(!S.stats||typeof S.stats!=='object')S.stats={};S.stats.tuned=+S.stats.tuned||0;if(!S.stats.play||typeof S.stats.play!=='object')S.stats.play={};S.stats.prog4=!!S.stats.prog4;
  ['proven','badges'].forEach(k=>{if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k]))S[k]={};});
  S.rest=S.rest?1:0;S.startLevel=Math.round(+S.startLevel)||0;S.lastWeekSeen=typeof S.lastWeekSeen==='string'?S.lastWeekSeen:'';S.lastMonthSeen=typeof S.lastMonthSeen==='string'?S.lastMonthSeen:'';S.interleave=['on','off'].includes(S.interleave)?S.interleave:'';if(!S.intent||typeof S.intent!=='object')S.intent={after:'',place:''};S.intent.after=String(S.intent.after||'').slice(0,40);S.intent.place=String(S.intent.place||'').slice(0,40);S.split=!!S.split;S.remind2=/^\d\d:\d\d$/.test(String(S.remind2||''))?S.remind2:'';if(!S.chkLog||typeof S.chkLog!=='object'||Array.isArray(S.chkLog))S.chkLog={};S.chkEst=S.chkEst!==false;
  if(!S.rev||typeof S.rev!=='object'||Array.isArray(S.rev))S.rev={};if(!S.pre||typeof S.pre!=='object'||Array.isArray(S.pre))S.pre={};if(!S.adj||typeof S.adj!=='object')S.adj=null;S.quick=typeof S.quick==='string'?S.quick:'';
  S.remind=typeof S.remind==='string'?S.remind:'';S.remindLate=!!S.remindLate;
  {const lv=x=>[1,2,3].includes(+x)?+x:1;S.earLvl={ivl:lv(S.earLvl&&S.earLvl.ivl),qual:lv(S.earLvl&&S.earLvl.qual)};if(!S.earRun||typeof S.earRun!=='object'||Array.isArray(S.earRun))S.earRun={};} /* ouvido em níveis: intervalos e acordes */
  S.grVib=!!S.grVib;S.recSecs=S.recSecs===60?60:30;if(!S.chal||typeof S.chal!=='object'||typeof S.chal.wk!=='string')S.chal=null;if(!S.chalLog||typeof S.chalLog!=='object'||Array.isArray(S.chalLog))S.chalLog={}; /* gravação de 30 ou 60 s; desafio da semana */if(!S.bpmLog||typeof S.bpmLog!=='object')S.bpmLog={};if(!S.stats.timing||typeof S.stats.timing!=='object')S.stats.timing={};if(!S.stats.strum||typeof S.stats.strum!=='object')S.stats.strum={};
  S.songs.forEach(s=>{if(typeof s.cifra!=='string')s.cifra='';s.tr=Math.max(-11,Math.min(11,Math.round(+s.tr)||0));s.capo=Math.max(0,Math.min(7,Math.round(+s.capo)||0));if(typeof s.pid!=='string')delete s.pid;s.bpm=s.bpm?Math.max(40,Math.min(160,Math.round(+s.bpm)||0)):0;s.per=s.per===2?2:1;s.plays=Math.max(0,Math.round(+s.plays)||0);s.ramp=!!s.ramp;s.lastPlay=typeof s.lastPlay==='string'?s.lastPlay:'';}); // tom, capotraste e batida de tocar junto, por música
  if(!S.easyOn||typeof S.easyOn!=='object'||Array.isArray(S.easyOn))S.easyOn={};
  if(!S.earLog||typeof S.earLog!=='object'||Array.isArray(S.earLog))S.earLog={};S.freeStart=Math.round(+S.freeStart)||0; // ouvido por modalidade; cronômetro de prática livre (carimbo de hora)
  {const vv=x=>{const n=Math.round(+x);return isNaN(n)?100:Math.max(0,Math.min(150,n));};S.volGuitar=vv(S.volGuitar);S.volClick=vv(S.volClick);} // volumes do violão e do clique, em porcento
  S.a4=Math.max(430,Math.min(450,Math.round(+S.a4)||440)); // Lá de referência do afinador e das notas do app
  S.mypats=Array.isArray(S.mypats)?S.mypats.filter(p=>p&&typeof p==='object'&&typeof p.id==='string'&&/^u[a-z0-9]+$/.test(p.id)&&Array.isArray(p.cells)&&[6,8].includes(p.cells.length)&&p.cells.every(c=>MP_CELLS.includes(c))).map(p=>({id:p.id,name:String(p.name||'').slice(0,40)||'Minha batida',cells:p.cells.slice(),bpm:Math.max(40,Math.min(160,Math.round(+p.bpm)||70)),tip:'Sua batida.',custom:true})).slice(0,20):[];
  S.mychords=Array.isArray(S.mychords)?S.mychords.filter(c=>c&&typeof c==='object'&&typeof c.n==='string'&&c.n.length<=12&&CHRE.test(c.n)&&Array.isArray(c.f)&&c.f.length===6&&c.f.every(x=>Number.isInteger(x)&&x>=-1&&x<=15)&&c.f.filter(x=>x>=0).length>=2).map(c=>({n:c.n,f:c.f.slice()})).filter((c,i,a)=>a.findIndex(x=>x.n===c.n)===i).slice(0,40):[]; // acordes meus: nome no formato de cifra e uma casa por corda
  S.font=[0,1,2].includes(+S.font)?+S.font:0;S.theme=['light','dark'].includes(S.theme)?S.theme:'';
  S.msub=[1,2,3].includes(+S.msub)?+S.msub:1;S.macc=['first','none','back'].includes(S.macc)?S.macc:'first';S.mgap=[0,2,4].includes(+S.mgap)?+S.mgap:0;S.mvib=!!S.mvib;S.lefty=!!S.lefty;
  S.tuning=['padrao','meio','dropd'].includes(S.tuning)?S.tuning:'padrao';S.tuneMode=S.tuneMode==='crom'?'crom':'cordas';S.hojeMore=!!S.hojeMore;S.guitar=GUITARS[S.guitar]?S.guitar:'nylon';
  S.welcomed=!!S.welcomed;if(S.onboarded&&!(o&&'welcomed' in o))S.welcomed=true; // quem já usava o app não vê as boas-vindas
  S.wgoal=[0,3,4,5,6,7].includes(+S.wgoal)?+S.wgoal:0;S.mclick=['beep','madeira','clave','bateria'].includes(S.mclick)?S.mclick:'beep';S.mflash=!!S.mflash;S.updSeen=typeof S.updSeen==='string'?S.updSeen:'';
  S.lastExport=typeof S.lastExport==='string'?S.lastExport:'';S.backupAsk=typeof S.backupAsk==='string'?S.backupAsk:'';S.recs=Array.isArray(S.recs)?S.recs.filter(r=>r&&typeof r==='object'&&r.id&&r.d):[];
  if(typeof S.seenVer!=='string')S.seenVer='';if(!S.seenVer&&S.onboarded&&!(o&&'seenVer' in o))S.seenVer='1.6.1'; // quem já usava o app antes deste recurso vê as novidades desde então
  S.level=Math.max(1,Math.min(9,Math.round(+S.level)||1)); // 9 = quantidade de níveis em LEVELS (definido mais abaixo)
  if(!S.ear||typeof S.ear!=='object')S.ear={ok:0,total:0};
}
adopt(null);
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object'){hadLocal=true;adopt(o);}}}catch(e){}
// No app nativo, cada gravação também vai para o armazenamento do aparelho (Preferences), que o sistema não apaga sozinho.
function save(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j);}catch(e){}if(NATIVE)native('Preferences','set',{key:KEY,value:j});}

/* ---------- aparência: tamanho da letra e tema, escolhidos em Perfil ---------- */
const THEME_META=[...document.querySelectorAll('meta[name="theme-color"]')].map(m=>[m,m.content]);
function applyLook(){
  const h=document.documentElement;h.className=S.font?'f'+S.font:'';
  if(S.theme)h.dataset.theme=S.theme;else delete h.dataset.theme;
  THEME_META.forEach(([m,orig])=>{m.content=S.theme==='dark'?'#171014':S.theme==='light'?'#F2EEF0':orig;});
}
applyLook();

/* ---------- erros: o app nunca fica mudo ---------- */
// Os últimos 5 erros ficam guardados fora do progresso e aparecem no Diagnóstico (Perfil), para mandar no suporte.
const ERRS=(()=>{try{const a=JSON.parse(localStorage.getItem(KEY+'-erros')||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}})();
function logErr(msg){ERRS.unshift(new Date().toISOString().slice(0,16).replace('T',' ')+' '+String(msg).slice(0,200));ERRS.length=Math.min(ERRS.length,5);try{localStorage.setItem(KEY+'-erros',JSON.stringify(ERRS));}catch(e){}}
window.addEventListener('error',e=>{logErr((e.message||'erro')+(e.lineno?' @'+e.lineno:''));toast('Algo deu errado. Detalhes em Perfil (na barra de baixo), Diagnóstico.');});
window.addEventListener('unhandledrejection',e=>{logErr('promessa: '+(e.reason&&e.reason.message||e.reason));});

/* ---------- exportar e importar o progresso ---------- */
const IMP={data:null,summary:'',text:''};
function exportData(){
  S.lastExport=today();save(); // o aviso de cópia de segurança conta a partir daqui
  const payload=JSON.stringify({app:'violao-diario',version:VER,exported:new Date().toISOString(),data:S}),name='violao-diario-'+today()+'.json';
  let file=null;try{file=new File([payload],name,{type:'application/json'});}catch(e){}
  if(NATIVE&&file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Progresso do Violão Diário'}).catch(()=>{});return;} // no app, compartilhar é o jeito de salvar em arquivo
  try{const url=URL.createObjectURL(new Blob([payload],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);toast('Arquivo '+name+' gerado.');}
  catch(e){IMP.text=payload;render();}
}
function mergeData(d){ // juntar um progresso importado ao deste aparelho: nada é apagado; dias ficam com o maior tempo, listas ganham o que faltava, marcas ficam com o melhor
  const keep=S;adopt(d);const inc=S;S=keep; // o arquivo passa pela mesma validação do carregamento
  Object.keys(inc.days).forEach(k=>{const b=inc.days[k],a=S.days[k]||(S.days[k]={min:0,done:{}});a.min=Math.max(a.min||0,b.min||0);Object.assign(a.done,b.done||{});if(!a.note&&b.note)a.note=b.note;if(b.full)a.full=true;if(b.rev&&!a.rev)a.rev=b.rev;});
  const order=['dominada','devagar','aprendendo'],newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  inc.songs.forEach(s=>{const mine=S.songs.find(x=>x.title.toLowerCase()===s.title.toLowerCase());if(!mine){if(S.songs.some(x=>x.id===s.id))s.id=newId('s');S.songs.push(s);return;}if(!mine.cifra&&s.cifra)mine.cifra=s.cifra;if(!mine.chords&&s.chords)mine.chords=s.chords;mine.plays=Math.max(mine.plays||0,s.plays||0);if((s.lastPlay||'')>(mine.lastPlay||''))mine.lastPlay=s.lastPlay;if(order.indexOf(s.status)<order.indexOf(mine.status))mine.status=s.status;});
  (inc.mypats||[]).forEach(p=>{if(!S.mypats.some(x=>x.id===p.id||x.name===p.name)&&S.mypats.length<20)S.mypats.push(p);});
  (inc.mychords||[]).forEach(c=>{if(!S.mychords.some(x=>x.n===c.n)&&S.mychords.length<40)S.mychords.push(c);});
  patsSync();chordsSync();
  inc.custom.forEach(t=>{if(S.custom.some(x=>trainCode(x)===trainCode(t)))return;if(S.custom.some(x=>x.id===t.id))t.id=newId('t');S.custom.push(t);});
  Object.keys(inc.changes).forEach(k=>{const a=S.changes[k]||(S.changes[k]=[]);(inc.changes[k]||[]).forEach(r=>{if(!a.some(x=>x.d===r.d&&x.n===r.n))a.push(r);});a.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);});
  Object.keys(inc.chords).forEach(n=>{if(inc.chords[n]==='dominado'||!S.chords[n])S.chords[n]=inc.chords[n];});
  Object.keys(inc.badges).forEach(b=>{if(!S.badges[b]||inc.badges[b]<S.badges[b])S.badges[b]=inc.badges[b];});
  Object.keys(inc.skills).forEach(k=>{S.skills[k]=true;});Object.keys(inc.proven).forEach(k=>{if(!S.proven[k]||inc.proven[k]<S.proven[k])S.proven[k]=inc.proven[k];});
  if(inc.level>S.level){S.level=inc.level;S.levelSince=inc.levelSince||S.levelSince;}if(inc.startLevel&&(!S.startLevel||inc.startLevel<S.startLevel))S.startLevel=inc.startLevel;
  S.stats.tuned=Math.max(S.stats.tuned||0,inc.stats.tuned||0);S.stats.prog4=!!(S.stats.prog4||inc.stats.prog4);
  Object.keys(inc.stats.play||{}).forEach(p=>{const a=S.stats.play[p]||(S.stats.play[p]={});Object.keys(inc.stats.play[p]).forEach(th=>{a[th]=Math.max(a[th]||0,inc.stats.play[p][th]||0);});});
  ['timing','strum'].forEach(g=>{Object.keys(inc.stats[g]||{}).forEach(k=>{if(!S.stats[g][k])S.stats[g][k]=inc.stats[g][k];});});
  S.ear.ok+=inc.ear.ok||0;S.ear.total+=inc.ear.total||0;Object.keys(inc.earLog||{}).forEach(m=>{const a=S.earLog[m]||(S.earLog[m]={ok:0,total:0});a.ok+=inc.earLog[m].ok||0;a.total+=inc.earLog[m].total||0;});
  Object.keys(inc.bpmLog||{}).forEach(k=>{S.bpmLog[k]=Math.max(S.bpmLog[k]||0,inc.bpmLog[k]||0);});S.maxBpm=Math.max(S.maxBpm||0,inc.maxBpm||0);

function streak(){let n=0,d=new Date(),used={};if(!practiced(dkey(d)))d=addDays(d,-1);
  for(;;){if(practiced(dkey(d)))n++;else{const w=wkKey(d);if(!S.rest||used[w])break;used[w]=true;}d=addDays(d,-1);}
  return n;}
function bestStreak(){const ks=Object.keys(S.days).filter(practiced).sort();if(!ks.length)return 0;let best=0,cur=0,used={},d=parseKey(ks[0]);const end=new Date();
  while(d<=end){if(practiced(dkey(d))){cur++;best=Math.max(best,cur);}else{const w=wkKey(d);if(S.rest&&!used[w])used[w]=true;else{cur=0;used={};}}d=addDays(d,1);}
  return best;}

function monthStats(back){ /* minutos, dias, maior sequência e conquistas de um mês (back: 0 este mês, 1 o anterior) */

  for(let i=1;i<=n;i++){const v=(S.days[ym+'-'+pad(i)]||{}).min||0;if(v>0){min+=v;days++;run++;best=Math.max(best,run);}else run=0;}

}

function csBar(ci){CS.ci=ci;const p=CS.cfg.prog,a=$('#cs-now'),b=$('#cs-next');if(a)a.innerHTML=chordBox(p[ci]);if(b)b.innerHTML=chordBox(p[(ci+1)%p.length]);
  if(ci===0){ // volta completa pela sequência: com "subir aos poucos", o andamento sobe 4 BPM, até 160
    if(CS.lapSeen&&CS.t.ramp&&CS.cfg.bpm<160){CS.cfg.bpm=Math.min(160,CS.cfg.bpm+4);const n=$('#cs-bpm');if(n)n.textContent=CS.cfg.bpm;const r=$('#cs-ramp');if(r)r.textContent='Subindo aos poucos: agora a '+CS.cfg.bpm+' BPM.';}
    CS.lapSeen=true;}}
function csNextPat(){
  const n=CS.t.pats.length;if(n<2)return;CS.pi=(CS.pi+1)%n;CS.cfg.pid=CS.t.pats[CS.pi];CS.ci=0;
  if(csOn()){grStop(true);csPlay();}else render(); // recomeça com um compasso de contagem na batida nova
}
function csAccrue(now){const dt=Math.min(Math.max(0,(now-CS.last)/1000),Math.max(0,CS.left));CS.left-=dt;CS.pending+=dt;CS.last=now;}
function csFlush(){ // grava o tempo tocado desde a última vez: histórico do treino e minutos inteiros do dia
  if(!CS||CS.pending<=0)return;
  const log=S.ctLog[CS.t.id]||(S.ctLog[CS.t.id]={}),e=log[today()]||(log[today()]={s:0,n:0});
  CS.played+=CS.pending;e.s=Math.round((e.s+CS.pending)*10)/10;CS.pending=0;
  if(!CS.counted&&CS.played>=30){e.n++;CS.counted=true;}
  const whole=Math.floor(CS.played/60);if(whole>CS.credited){addMinutes(whole-CS.credited);CS.credited=whole;}else save();
}
function csSettle(){ // fecha o treino: grava o que falta e arredonda os minutos do dia a partir de meio minuto
  if(csOn())grStop(true);else csFlush();
  if(CS.played-CS.credited*60>=30){addMinutes(1);CS.credited++;}
  return CS.credited;
}
function csFinish(){
  CS.done={min:csSettle(),full:CS.left<=0};
  strum(chordMidis(CS.t.chords[0]));buzz(120);render();
}
function csTick(now){ // o tempo só corre enquanto o treino está tocando
  if(!csOn())return;
  csAccrue(now);
  const el=$('#cs-time');if(el){el.textContent=mmss(CS.left);const b=$('#cs-bar');if(b)b.style.width=Math.max(0,CS.left/CS.total*100)+'%';}
  if(CS.left<=0){csFinish();return;}
  if(Math.floor((CS.played+CS.pending)/60)>CS.credited)csFlush(); // grava a cada minuto completo
  const seg=Math.floor((CS.total-CS.left)/(CS.total/CS.t.pats.length)); // o tempo é dividido igualmente entre as batidas
  if(seg>CS.seg){CS.seg=seg;csNextPat();}
}
function ctStats(id){const log=S.ctLog[id]||{},ks=Object.keys(log).filter(k=>log[k]&&log[k].s>0).sort();let s=0,n=0;ks.forEach(k=>{s+=log[k].s;n+=log[k].n||0;});return {s,n,ks,log};}

/* ---------- tuner ---------- */
// Afinações: padrão, meio tom abaixo (comum em muita música brasileira, para cantar mais grave) e Drop D.
const TUNINGS=[{id:'padrao',name:'Padrão (E A D G B E)',m:[40,45,50,55,59,64]},{id:'meio',name:'Meio tom abaixo (Eb)',m:[39,44,49,54,58,63],flat:true},{id:'dropd',name:'Drop D (D A D G B E)',m:[38,45,50,55,59,64]}];
const FLAT_L={'D#':'Eb','G#':'Ab','C#':'Db','F#':'Gb','A#':'Bb'},FLAT_P={'Ré#':'Mib','Sol#':'Láb','Dó#':'Réb','Fá#':'Solb','Lá#':'Sib'};
function strs(){const t=TUNINGS.find(x=>x.id===S.tuning)||TUNINGS[0];return t.m.map((m,i)=>{const pc=m%12;return {n:6-i,l:t.flat&&FLAT_L[NL[pc]]||NL[pc],pt:t.flat&&FLAT_P[NPT[pc]]||NPT[pc],m};});}
let MIC=null,micErr=false;
async function micStart(mode){ // mode: 'tune' (afinador) ou 'count' (contar trocas pelo som)
  micErr=false;mode=mode||'tune';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('sem suporte');
    const ac=audio();if(!ac)throw new Error('sem áudio');
    try{if(navigator.audioSession)navigator.audioSession.type='play-and-record';}catch(e){} // iOS: sessão com entrada de áudio, antes de pedir o microfone
    if(SIL&&!SIL.paused)SIL.pause();
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    try{const r=ac.resume();if(r&&r.catch)r.catch(()=>{});}catch(e){} // o iOS pode pausar o motor de som ao ligar o microfone
    const src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();
    if(mode==='tune'||mode==='sing')an.fftSize=4096;else{an.fftSize=16384;an.smoothingTimeConstant=.5;} // contar e conferir precisam separar notas graves vizinhas
    src.connect(an);
    MIC={mode,stream,src,an,buf:new Float32Array(4096),fd:new Float32Array(an.frequencyBinCount),hist:[],zero:0,hold:0,timer:setInterval({count:countTick,check:checkTick,sing:singTick}[mode]||micTick,mode==='tune'||mode==='sing'?95:80)};
  }catch(e){micErr=true;MIC=null;try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e2){}}
  render();
}
// Religar: descarta o motor de som e cria outro dentro do toque, junto com o microfone. No iPhone, um motor criado antes
// do microfone às vezes recebe silêncio dele; criar os dois juntos resolve.
function micAgain(mode){micStop();audioReset();if(mode==='count')countReset();if(mode==='check')chkReset();micStart(mode);}
function micChroma(){ // espectro do microfone → energia de cada uma das 12 notas (cromagrama, máximo 1) e nível do sinal
  const an=MIC.an,fd=MIC.fd;an.getFloatFrequencyData(fd);
  const binHz=AC.sampleRate/an.fftSize,i0=Math.max(1,Math.floor(70/binHz)),i1=Math.min(fd.length-1,Math.ceil(1800/binHz)),ch=new Array(12).fill(0);let peak=-200;
  for(let i=i0;i<=i1;i++){const db=fd[i];if(db>peak)peak=db;if(db<-80)continue;const f=i*binHz,w=f<250?1:f<500?.7:f<1000?.4:.2; // harmônicos agudos pesam menos
    ch[((Math.round(12*Math.log2(f/S.a4))+69)%12+12)%12]+=Math.pow(10,db/20)*w;}
  const mx=Math.max.apply(null,ch)||1;MIC.zero=peak===-Infinity?MIC.zero+1:0;
  return {ch:ch.map(v=>v/mx),quiet:peak<-62,lvl:Math.max(0,Math.min(1,(peak+70)/50))};
}

/* ---------- conferir um acorde pelo som: que corda não soou, que dedo parece fora do lugar ---------- */
// Nota do acorde fraca no cromagrama = corda que não soou (dedo mal apertado ou abafada por outro dedo).
// Nota forte fora do acorde = dedo uma casa acima ou abaixo, ou corda que não devia tocar. É uma ajuda, não um juiz.
const CHK={c:null,n:0,last:'',ok:0,est:'',pending:null,agree:0,asked:0};
function chkReset(){CHK.n=0;CHK.last='';CHK.ok=0;CHK.est='';CHK.pending=null;}
function chkClean(c){ /* três dias diferentes com o acorde limpo no microfone: dominado (critério de domínio: repetir a versão certa várias vezes) */
  const l=S.chkLog[c]||(S.chkLog[c]=[]);if(l.includes(today()))return;l.push(today());if(l.length>10)l.shift();
  if(l.length>=3&&S.chords[c]!=='dominado'){S.chords[c]='dominado';toast('Três dias com o '+c+' limpo: marcado como dominado. Em Acordes dá para mudar.');}save();
}
function checkRead(ch){
  const ci=chordInfo(CHK.c),v=voicing(ci),rows=v.filter(r=>!r.muted),want=new Set(rows.map(r=>r.midi%12));
  const ref=[...want].reduce((a,p)=>a+ch[p],0)/want.size||1; // a régua é a energia média das notas do acorde, porque uma corda grave soa bem mais forte que uma aguda
  const weak=[...want].filter(p=>ch[p]<.2*ref),loud=[];for(let p=0;p<12;p++)if(!want.has(p)&&ch[p]>.4*ref)loud.push(p);
  const bad=new Set(),done=new Set(),msgs=[];
  loud.forEach(p=>{const off=k=>rows.find(r=>(r.midi+k)%12===p&&weak.includes(r.midi%12)),up=off(1),dn=off(11),mu=v.find(r=>r.muted&&OPEN[r.i]%12===p); // nota errada + nota certa faltando na mesma corda = dedo uma casa fora
    if(up){bad.add(up.i);done.add(up.midi%12);msgs.push('A '+up.n+'ª corda parece uma casa acima do lugar: soou '+NPT[p]+' em vez de '+up.tone.pt+'.');}

// as notas extras aparecem de verdade, com histerese para não oscilar. Uma troca é contada quando o acorde reconhecido

  const A=new Set(chordMidis(T.a).map(m=>m%12)),B=new Set(chordMidis(T.b).map(m=>m%12));

  if(a!=null&&b!=null)return a>b+.12?'a':b>a+.12?'b':null;
  if(a==null&&b!=null)return b>(CNT.cur==='b'?.3:.5)*sh?'b':'a'; // A está dentro de B
  if(b==null&&a!=null)return a>(CNT.cur==='a'?.3:.5)*sh?'a':'b'; // B está dentro de A

function detectPitch(buf,sr){
  const n=buf.length;let rms=0;for(let i=0;i<n;i++)rms+=buf[i]*buf[i];if(Math.sqrt(rms/n)<.008)return 0;

  let d=1;while(d<maxLag&&c[d]>c[d+1])d++;

function tmTap(){
  if(!AC||!TM.timer)return;const per=60/TM.bpm,now=AC.currentTime,idx=Math.round((now-TM.t0)/per);
  if(TM.mode==='batida'){let best=null;TM.slots.forEach(s=>{if(best==null||Math.abs(now-s.t)<Math.abs(now-best.t))best=s;});
    if(!best||best.d!=null||Math.abs(now-best.t)>per/4){TM.extra++;return;} // longe de qualquer seta, ou seta já tocada
    best.d=Math.round((now-best.t)*1000);TM.taps.push({i:best.i,d:best.d});
    const el=$('#tm-last');if(el){el.textContent=(best.d>0?'+':'')+best.d+' ms';el.className='num tm-last '+(Math.abs(best.d)<=40?'good':Math.abs(best.d)<=90?'mid':'bad');}
    buzz(8);return;}
  if(idx<TM_COUNT||idx>=TM_COUNT+TM_BEATS||TM.taps.some(x=>x.i===idx))return; // só os tempos medidos, um toque por tempo
  const d=Math.round((now-(TM.t0+idx*per))*1000);TM.taps.push({i:idx,d});
  const el=$('#tm-last');if(el){el.textContent=(d>0?'+':'')+d+' ms';el.className='num tm-last '+(Math.abs(d)<=40?'good':Math.abs(d)<=90?'mid':'bad');}
  buzz(8);
}
function tmFinish(){
  clearInterval(TM.timer);TM.timer=null;TM.phase='done';const ds=TM.taps.map(x=>x.d),n=ds.length;
  const mean=n?Math.round(ds.reduce((a,b)=>a+b,0)/n):0,sd=n?Math.round(Math.sqrt(ds.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n)):0,hits=ds.filter(d=>Math.abs(d)<=60).length;
  TM.res={mean,sd,hits,n};
  if(TM.mode==='batida'){const P=PAT[tmPid()],total=TM.slots.length,cells=P.cells.map((c,i)=>{if(!c)return null;const cd=TM.taps.filter(x=>x.i===i).map(x=>x.d);return cd.length?Math.round(cd.reduce((a,b)=>a+b,0)/cd.length):null;});
    const score=total?Math.round(hits/total*100):0;Object.assign(TM.res,{total,missed:total-n,extra:TM.extra,cells,score});
    if(n>=4){const k=tmPid();if((S.stats.strum[k]||0)<score){S.stats.strum[k]=score;TM.res.record=true;}addMinutes(1);save();}}
  else if(n>=8){const t=S.stats.timing,k=String(TM.bpm);if(t[k]==null||sd<t[k]){t[k]=sd;TM.res.record=true;}addMinutes(1);save();}
  awakeSync();render();
}

  const m=sub.ouvido;if(m!=='ivl'&&m!=='qual'&&m!=='bat')return;const r=S.earRun[m]||(S.earRun[m]={ok:0,total:0});r.total++;if(ok)r.ok++;

function patPlayOnce(P,chord,bpm,bars){ /* um ou dois compassos de uma batida num acorde só, com o clique nos tempos (ouvido, Batida) */
  const ac=audio();if(!ac)return;const c=shape(chord);if(!c)return;const n=P.cells.length,dur=30/bpm,t0=ac.currentTime+.1,played=[];c.f.forEach((f,si)=>{if(f>=0)played.push(si);});const m=si=>OPEN[si]+c.f[si];

    if(cell==='↓'){pickAt(t,.05);played.forEach((si,k)=>pluckAt(m(si),t+k*.016,i===0?.36:.3,si));}
    else if(cell==='↑'){pickAt(t,.03);played.slice(-4).reverse().forEach((si,k)=>pluckAt(m(si),t+k*.012,.22,si));}

/* ---------- dedos-âncora: o que fica e o que muda entre dois acordes ---------- */
function anchorTip(a,b){
  const A=shape(a),B=shape(b);if(!A||!B||a===b)return '';
  const shift=k=>A.f.every((f,i)=>f<=0||(B.f[i+k]===f&&B.d[i+k]===A.d[i]))&&B.f.every((f,i)=>f<=0||(A.f[i-k]===f&&A.d[i-k]===B.d[i]));
  if(shift(1))return 'O '+b+' é o desenho do '+a+' uma corda para baixo (mais aguda): mova a mão inteira, sem desmontar os dedos.';
  if(shift(-1))return 'O '+b+' é o desenho do '+a+' uma corda para cima (mais grave): mova a mão inteira, sem desmontar os dedos.';
  const bs=barreShape(b);if(bs&&bs.shape===a)return 'O '+b+' é o desenho do '+a+' '+bs.fret+(bs.fret===1?' casa':' casas')+' acima: deite o dedo 1 na casa '+bs.fret+' e repita o desenho com os outros dedos.';
  const pos=c=>{const p={};c.f.forEach((f,i)=>{if(f>0)(p[c.d[i]]=p[c.d[i]]||[]).push([i,f]);});return p;};
  const pa=pos(A),pb=pos(B),where=x=>x.length>1?'a pestana na casa '+x[0][1]:'a '+(6-x[0][0])+'ª corda, casa '+x[0][1];
  const stay=[],move=[],out=[],inn=[];
  for(let d=1;d<=4;d++){const x=pa[d],y=pb[d];if(x&&y){const same=x.length===y.length&&x.every(([i,f])=>y.some(([j,g])=>i===j&&f===g));(same?stay:move).push(d);}else if(x)out.push(d);else if(y)inn.push(d);}
  const ds=arr=>arr.length===1?'o dedo '+arr[0]:'os dedos '+listPt(arr.map(String));
  const changes=move.map(d=>'o dedo '+d+' vai d'+where(pa[d]).replace(/^a /,'a ')+' para '+where(pb[d])).concat(out.map(d=>'o dedo '+d+' sai'),inn.map(d=>'o dedo '+d+' entra n'+where(pb[d]).replace(/^a /,'a ')));
  if(stay.length)return ds(stay).replace(/^o/,'O')+(stay.length===1?' fica':' ficam')+' no lugar'+(changes.length?'; '+changes.join('; ')+'.':'.');
  const low=B.f.map((f,i)=>f>0?[i,B.d[i]]:null).filter(Boolean)[0];
  return 'Nenhum dedo fica no lugar: mova os dedos juntos, começando pelo dedo '+(low?low[1]:1)+', que vai para a corda mais grave.';
}

// Tudo sai do nome do acorde (tônica, m, 7, maj7) e do desenho: que nota cada corda dá e que função ela tem.
const LET='CDEFGAB',LPC=[0,2,4,5,7,9,11],LPT={C:'Dó',D:'Ré',E:'Mi',F:'Fá',G:'Sol',A:'Lá',B:'Si'},OPENL=['E','A','D','G','B','E'];
const ROLE={T:['a tônica','Tônica'],'3M':['a terça maior','Terça maior'],'3m':['a terça menor','Terça menor'],'5J':['a quinta justa','Quinta justa'],'7m':['a sétima menor','Sétima menor'],'7M':['a sétima maior','Sétima maior'],'2M':['a segunda maior','Segunda maior'],'4J':['a quarta justa','Quarta justa'],'9M':['a nona maior','Nona maior']};
const TH={c:null};
const rk=r=>r==='T'?'T':/^[249]/.test(r)?'3':r[0]; // cor da função: T, 3 (ou a nota que ocupa o lugar da terça: 2, 4, 9), 5 ou 7
const ptLong=pt=>pt.replace('#',' sustenido').replace(/b$/,' bemol');

function spell(L,rootPc,steps,semis){ // nota a "steps" letras e "semis" semitons da tônica, com o nome certo (Mib, e não Ré#)
  const li=(LET.indexOf(L)+steps)%7,N=LET[li],pc=(rootPc+semis)%12,d=((pc-LPC[li]+18)%12)-6,acc=d>0?'#'.repeat(d):'b'.repeat(-d);
  return {pc,semis,letter:N+acc,pt:LPT[N]+acc};
}
function chordInfo(n){
  const m=/^([A-G])([#b]?)(m(?!aj))?(maj7|7|5)?(sus2|sus4|add9)?(?:\/([A-G])([#b]?))?$/.exec(n);if(!m||!CH[n])return null;
  const L=m[1],rootPc=(LPC[LET.indexOf(L)]+(m[2]==='#'?1:m[2]==='b'?11:0))%12,minor=!!m[3],pow=m[4]==='5',sev=pow?'':m[4]||'',ext=m[5]||'';
  const third=ext==='sus2'?Object.assign({r:'2M'},spell(L,rootPc,1,2)):ext==='sus4'?Object.assign({r:'4J'},spell(L,rootPc,3,5)):Object.assign({r:minor?'3m':'3M'},spell(L,rootPc,2,minor?3:4)); // suspenso: a terça dá lugar à segunda ou à quarta
  const tones=pow?[Object.assign({r:'T'},spell(L,rootPc,0,0)),Object.assign({r:'5J'},spell(L,rootPc,4,7))]:[Object.assign({r:'T'},spell(L,rootPc,0,0)),third,Object.assign({r:'5J'},spell(L,rootPc,4,7))]; // power chord: só tônica e quinta
  if(sev)tones.push(Object.assign({r:sev==='maj7'?'7M':'7m'},spell(L,rootPc,6,sev==='maj7'?11:10)));
  if(ext==='add9')tones.push(Object.assign({r:'9M'},spell(L,rootPc,8,14))); // a segunda, uma oitava acima

function hfMidis(n){const c=hfShape(n);if(c)return c.f.map((f,i)=>f<0?null:OPEN[i]+f).filter(m=>m!==null);const m=/^([A-G][#b]?)dim$/.exec(n);if(!m)return null;const r=48+pcOf(m[1][0],m[1][1]||'');return [r,r+3,r+6,r+12];}
