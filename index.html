<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violão Diário</title>
<meta name="app-version" content="1.2.0">
<meta name="description" content="Treino diário de violão: plano por nível, metrônomo, afinador, batidas para tocar junto, acordes e notas.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2EEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171014" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Violão Diário">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EEF0; --surface:#FFFFFF; --surface-2:#F8F3F5; --ink:#24161D; --muted:#6E5C65; --line:#E0D6DB;
  --primary:#7A2E4D; --on-primary:#FFFFFF; --primary-soft:#F1E1E8;
  --brass:#C98A1B; --brass-soft:#F3E3C2; --ok:#2F7D6B; --warn:#B5382A;
  /* áreas do entalhe e da barra de gestos; no app Android, WebViews antigas recebem --safe-area-inset-* do Capacitor */
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
  --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  box-sizing:border-box;
  padding-top:var(--sat);
  padding-bottom:var(--sab);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171014; --surface:#22181D; --surface-2:#2B1F25; --ink:#F3EAEE; --muted:#A99AA2; --line:#3A2B32;
    --primary:#E38FB0; --on-primary:#2A0F1B; --primary-soft:#3A2230;
    --brass:#E9B44C; --brass-soft:#44361A; --ok:#5CC2A8; --warn:#F08A7B;
  }
}
:root[data-theme="dark"]{
  --bg:#171014; --surface:#22181D; --surface-2:#2B1F25; --ink:#F3EAEE; --muted:#A99AA2; --line:#3A2B32;
  --primary:#E38FB0; --on-primary:#2A0F1B; --primary-soft:#3A2230;
  --brass:#E9B44C; --brass-soft:#44361A; --ok:#5CC2A8; --warn:#F08A7B;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:var(--sat);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* faixa atrás da barra de status: o conteúdo rola por baixo dela sem encostar no relógio e na bateria */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:7}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:22px 18px 120px}
#snd-wrap[hidden],#upd-wrap[hidden]{display:none}
.steps{padding-left:1.25em;line-height:1.6;margin-top:10px}
.steps li+li{margin-top:4px}

/* type */
h1{font-stretch:125%;font-weight:800;font-size:2.1rem;letter-spacing:-.02em;line-height:1.05}
h2{font-stretch:112%;font-weight:750;font-size:1.2rem;letter-spacing:-.01em;line-height:1.2}
h3{font-weight:700;font-size:1.02rem;line-height:1.25}
.sub{color:var(--muted);margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-stretch:62%;font-weight:800;font-variant-numeric:tabular-nums;line-height:.9;letter-spacing:-.01em}

/* layout pieces */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.streak{display:flex;align-items:center;gap:8px;text-align:left}
.streak .num{font-size:3.4rem;color:var(--primary)}
.streak .lbl{font-size:.8rem;line-height:1.15;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.panel + .panel{margin-top:14px}
.stack > * + *{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* buttons */
.btn{border:0;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:700;padding:0 22px;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.quiet{background:var(--primary-soft);color:var(--primary)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:42px;padding:0 16px;font-size:.92rem}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
.link{background:none;border:0;color:var(--primary);font-weight:650;text-decoration:underline;text-underline-offset:3px;padding:10px 0;min-height:42px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:0 14px;min-height:42px;font-weight:650;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;min-height:42px;padding:0 6px;border-radius:999px;font-weight:650;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg.tight button{padding:0 2px;font-stretch:86%;line-height:1.15}

/* week neck */
.neck{margin:0 -4px 18px}
.neck svg{display:block;width:100%;height:auto}
.neck .wood{fill:var(--surface)}
.neck .str{stroke:var(--muted);opacity:.75}
.neck .fret{stroke:var(--brass);stroke-width:2.5}
.neck .nut{fill:var(--ink)}
.neck .dot-full{fill:var(--brass)}
.neck .dot-part{fill:var(--brass-soft);stroke:var(--brass);stroke-width:2}
.neck .dot-today{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:4 4}
.neck text{font-size:11px;fill:var(--muted);font-weight:600;text-anchor:middle}
.neck text.today{fill:var(--ink);font-weight:800}
@keyframes pluck{0%,100%{transform:translateY(0)}15%{transform:translateY(-1.6px)}35%{transform:translateY(1.3px)}55%{transform:translateY(-.9px)}75%{transform:translateY(.5px)}}
.neck.ring .str{animation:pluck .5s ease-out 2;transform-box:fill-box}
.neck.ring .str:nth-of-type(2){animation-delay:.04s}.neck.ring .str:nth-of-type(3){animation-delay:.08s}
.neck.ring .str:nth-of-type(4){animation-delay:.12s}.neck.ring .str:nth-of-type(5){animation-delay:.16s}.neck.ring .str:nth-of-type(6){animation-delay:.2s}
@media (prefers-reduced-motion: reduce){.neck.ring .str{animation:none}.btn:active{transform:none}}

/* plan */
.blocks{list-style:none;counter-reset:b}
.blk{counter-increment:b;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:6px}
.blk::before{content:counter(b);width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:750;color:var(--muted);font-size:.95rem}
.blk.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--surface)}
.blk.active::before{border-color:var(--primary);color:var(--primary)}
.blk.done p,.blk.done .extra{display:none}
.blk.done h3{color:var(--muted)}
.blk p{margin-top:6px;color:var(--muted)}
.blk .mins{color:var(--muted);font-weight:600;font-size:.9rem;white-space:nowrap}
.blk .acts{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.timer{font-size:4.2rem;color:var(--primary);margin-top:12px}
.extra{margin-top:12px}

/* rhythm grid */
.rhy{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:320px}
.rhy div{background:var(--surface-2);border-radius:8px;text-align:center;padding:6px 0 4px}
.rhy b{display:block;font-size:1.3rem;line-height:1.1;min-height:1.45rem;color:var(--ink)}
.rhy span{font-size:.72rem;color:var(--muted);font-weight:600}
.rhy div.on{background:var(--primary-soft)}
.rhy div.now{background:var(--brass-soft);box-shadow:inset 0 0 0 2px var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.progrow{display:flex;gap:6px;margin-top:14px}
.progrow span{flex:1;text-align:center;border-radius:12px;background:var(--surface-2);padding:10px 0;font-stretch:75%;font-weight:800;font-size:1.5rem;line-height:1}
.progrow span.now{background:var(--primary);color:var(--on-primary)}
.bpmrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.bpmrow .num{font-size:2.6rem}
.bpmrow button{width:56px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:750}
/* notes */
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scale button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale b{font-stretch:75%;font-size:1.8rem;font-weight:800;line-height:1}
.scale span{font-size:.8rem;font-weight:700}
.scale small{font-size:.68rem;color:var(--muted);font-weight:600;line-height:1.2;text-align:center}
.scale button.hit,.scale button:active{border-color:var(--brass);background:var(--brass-soft)}
.fbwrap{overflow-x:auto;margin:14px -18px 0;padding:0 18px 8px}
.fb{display:grid;grid-template-columns:26px 46px repeat(12,48px);width:max-content}
.fb .hd{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center;padding-bottom:6px}
.fb .hd.mk{color:var(--ink)}
.fb .sl{font-size:.72rem;font-weight:700;color:var(--muted);display:grid;place-items:center}
.fb button{height:44px;border:0;border-right:2px solid var(--brass);background:linear-gradient(var(--muted),var(--muted)) center/100% 1.5px no-repeat;display:grid;place-items:center;padding:0}
.fb button.open{border-right:5px solid var(--ink)}
.fb button i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82rem;background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.fb button.sharp i{width:12px;height:12px;font-size:0;background:var(--line);border:0}
.fb.all button.sharp i{width:32px;height:32px;font-size:.72rem;background:var(--surface-2);border:1.5px solid var(--line);color:var(--muted)}
.fb button.hit i{background:var(--primary);border-color:var(--primary);color:var(--on-primary);width:32px;height:32px;font-size:.78rem}
.fbinfo{min-height:3em;margin-top:10px;font-weight:650}

/* chords */
.chord svg{display:block;width:100%;height:auto}
.chord .g{stroke:var(--muted);stroke-width:1.2;opacity:.8}
.chord .nutc{fill:var(--ink)}
.chord .fd{fill:var(--primary)}
.chord .ft{fill:var(--on-primary);font-size:10px;font-weight:800;text-anchor:middle}
.chord .mk{fill:var(--muted);font-size:11px;font-weight:700;text-anchor:middle}
.chord .bf{fill:var(--muted);font-size:10px;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ctile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.ctile .play{background:none;border:0;text-align:left;border-radius:12px}
.ctile .name{font-stretch:75%;font-weight:800;font-size:1.9rem;line-height:1}
.st{border:0;border-radius:10px;min-height:38px;font-weight:700;font-size:.85rem;background:var(--surface-2);color:var(--muted)}
.st[data-s="aprendendo"]{background:var(--brass-soft);color:var(--ink)}
.st[data-s="dominado"]{background:var(--ok);color:var(--surface)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:260px}
.pair .chord{text-align:center}
.pair .chord strong{font-stretch:75%;font-size:1.3rem}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.filters .chip{white-space:nowrap;flex:none}

/* metronome */
.metro{text-align:center}
.metro .bpm{font-size:8.5rem;color:var(--ink)}
.metro .bpm-l{color:var(--muted);font-weight:650;margin-top:2px}
.dots{display:flex;justify-content:center;gap:10px;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:transform .05s}
.dots i.on{background:var(--brass);transform:scale(1.35)}
.dots i.first.on{background:var(--primary)}
.stepper{display:flex;justify-content:center;gap:8px;margin:14px 0}
.stepper button{width:56px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:750}
input[type=range]{width:100%;accent-color:var(--primary);min-height:36px}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
.field input[type=number]{width:64px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);text-align:center;font-weight:700;color:var(--ink)}
.snd{background:var(--brass-soft);border:1.5px solid var(--brass);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.snd p{font-weight:650;margin-bottom:10px}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sab));background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px 6px 18px;display:none;align-items:center;gap:12px;font-weight:650;font-size:.92rem;z-index:5;white-space:nowrap}
.pill.show{display:flex}
.pill button{border:0;border-radius:999px;background:var(--bg);color:var(--ink);min-height:36px;padding:0 14px;font-weight:750}

/* tuner */
.heads{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.heads button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.heads button:active,.heads button.hit{border-color:var(--brass);background:var(--brass-soft)}
.heads b{font-stretch:75%;font-size:1.7rem;font-weight:800;line-height:1}
.heads span{font-size:.72rem;color:var(--muted);font-weight:600}
.meter{position:relative;height:46px;margin:18px 0 8px;border-radius:12px;background:var(--surface-2);overflow:hidden}
.meter::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12%;transform:translateX(-50%);background:var(--ok);opacity:.22}
.meter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ok)}
.needle{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--ink);left:50%;transform:translateX(-50%);transition:left .12s linear;z-index:1}
.tnote{font-size:4.4rem;text-align:center}

/* changes */
.tap{width:100%;border:0;border-radius:24px;background:var(--primary);color:var(--on-primary);padding:26px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
.tap .num{font-size:9rem}
.tap:active{filter:brightness(1.08)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--brass);width:100%}
select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 12px;font-weight:700;min-width:96px}
.big{font-size:6rem;text-align:center;color:var(--primary)}
.hist{list-style:none}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist svg{width:90px;height:28px;flex:none}
.hist polyline{fill:none;stroke:var(--brass);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ear */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:58px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:750;font-size:1.1rem}
.opt.right{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--warn);color:var(--warn)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stats div{background:var(--surface);padding:16px}
.stats .num{font-size:2.8rem;display:block}
.stats span{color:var(--muted);font-size:.88rem;font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.chart .b{fill:var(--primary)}
.chart .b0{fill:var(--line)}
.chart .goal{stroke:var(--brass);stroke-width:1.5;stroke-dasharray:4 4}
.chart text{font-size:10px;fill:var(--muted);text-anchor:middle;font-weight:600}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv b{font-weight:750;text-align:right}

/* path */
.lvl{border-top:1px solid var(--line);padding:16px 0}
.lvl:first-child{border-top:0;padding-top:0}
.lvl .tag{font-size:.8rem;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:8px;padding:3px 8px}
.skill{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:10px 0;min-height:44px}
.skill i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem;color:transparent;margin-top:1px}
.skill[aria-pressed="true"] i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.skill[aria-pressed="true"] span{color:var(--muted)}

/* songs */
.inp{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 14px}
.song{padding:14px 0;border-top:1px solid var(--line)}
.song:first-child{border-top:0}
.song .cif{color:var(--muted);font-weight:600;margin-top:2px;word-break:break-word}

/* meu treino */
.seq{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;min-height:42px;align-items:center}
.chip.on{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.btn:disabled,.chip:disabled{opacity:.45;cursor:default}
.grp{font-size:.8rem;font-weight:700;color:var(--muted);margin:16px 0 8px}
.cmini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.cmini .chord{border:0;background:none;padding:0;text-align:center;border-radius:12px}
.cmini strong{font-stretch:75%;font-size:1.1rem}
.patprev{margin-top:14px}
.patprev>b{display:block;font-size:.9rem;margin-bottom:6px}
.ct .acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.cs-pair{margin-top:14px}
.cs-pair .chord{border-radius:14px;padding:8px 8px 2px}
.cs-pair .chord:first-child{background:var(--primary-soft)}
.cs-pair .chord>span{display:block}

/* onboarding */
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;min-height:56px}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.choice b{display:block}
.choice span{color:var(--muted);font-size:.9rem}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:6}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{border:0;background:none;padding:9px 1px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:650;font-stretch:82%;white-space:nowrap;color:var(--muted);min-height:60px;min-width:0}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--primary)}
@media (max-width:350px){.tabs button{font-stretch:70%;font-size:.66rem}}
</style>
</head>

function audio(){

}

    catch(e){DIAG.alt='sem suporte';S.altOut=false;save();}

  COMP.connect(AC.destination);
}
function makeWav(sec,freq){
  const sr=8000,n=Math.floor(sr*sec),b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)b[44+i]=freq?128+Math.round(90*Math.sin(2*Math.PI*freq*i/sr)*Math.min(1,i/200,(n-i)/800)):128;
  return b;
}
const dataURI=b=>{let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s);};
const blobURL=b=>URL.createObjectURL(new Blob([b],{type:'audio/wav'}));

  try{if(navigator.audioSession){navigator.audioSession.type='playback';DIAG.sil='modo mídia pedido ao sistema';}}catch(e){}

    if(!SIL){const b=makeWav(.5,0);let triedBlob=false;SIL=new Audio();SIL.loop=true;SIL.setAttribute('playsinline','');
      SIL.onplaying=()=>{DIAG.sil='áudio auxiliar tocando';};
      SIL.onerror=()=>{if(!triedBlob){triedBlob=true;try{SIL.src=blobURL(b);const r=SIL.play();if(r&&r.catch)r.catch(()=>{});}catch(e){}}else DIAG.sil='áudio auxiliar bloqueado pela página';};
      SIL.src=dataURI(b);}
    if(SIL.paused){const r=SIL.play();if(r&&r.catch)r.catch(e=>{DIAG.sil='áudio auxiliar recusado ('+e.name+')';});}
  }catch(e){}
  if(S.altOut&&ALT&&ALT.paused){try{const r=ALT.play();if(r&&r.catch)r.catch(()=>{});}catch(e){}}
}

}

function ksBuffer(midi){
  if(KS[midi])return KS[midi];

  const b=AC.createBuffer(1,len,sr),d=b.getChannelData(0);let prev=0,peak=0;
  for(let i=0;i<N;i++){prev=.5*prev+.5*(Math.random()*2-1);d[i]=prev;}
  for(let i=N;i<len;i++){d[i]=.9972*.5*(d[i-N]+(i-N-1>=0?d[i-N-1]:0));}
  for(let i=0;i<len;i++){const a=Math.abs(d[i]);if(a>peak)peak=a;}
  const fade=Math.floor(sr*.35);
  for(let i=0;i<len;i++){let g=.9/(peak||1);if(i>len-fade)g*=(len-i)/fade;d[i]*=g;}
  return KS[midi]={buf:b,rate:f/(sr/(N+.5))};
}

  const ac=audio();if(!ac)return;

}

  const ac=audio();if(!ac)return;
  try{const k=ksBuffer(midi),s=ac.createBufferSource(),g=ac.createGain();s.buffer=k.buf;s.playbackRate.value=k.rate;g.gain.value=gain;s.connect(g);g.connect(OUT);s.start(t);
    if(si!=null){choke(si,t,.006);VOICE[si]={s,g};}}catch(e){}

function choke(si,t,tc){const v=VOICE[si];if(!v)return;delete VOICE[si];try{v.g.gain.setTargetAtTime(0,t,tc);v.s.stop(t+tc*12);}catch(e){}}

function slapAt(t){
  const ac=audio();if(!ac)return;
  try{if(!NOISE){const n=Math.floor(ac.sampleRate*.09);NOISE=ac.createBuffer(1,n,ac.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}
    dampAll(t);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=NOISE;f.type='bandpass';f.frequency.value=1700;f.Q.value=.7;g.gain.value=.9;s.connect(f);f.connect(g);g.connect(OUT);s.start(t);}catch(e){}

    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime((accent?.8:.5)*vol,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.06);

}

/* ---------- metronome ---------- */
const M={bpm:S.bpm||70,beats:S.beats||4,on:false,next:0,beat:0,bar:0,since:0,timer:null,taps:[],ramp:{on:false,step:5,bars:4,target:120}};
function mStart(){const ac=audio();if(!ac)return;grStop(true);M.on=true;M.beat=0;M.bar=0;M.next=ac.currentTime+.08;M.since=ac.currentTime;M.timer=setInterval(mSched,25);mPaint();awakeSync();}

function mSched(){
  if(!M.on||!AC)return;
  while(M.next<AC.currentTime+.12){
    const b=M.beat,t=M.next;
    tick(t,b===0?2:(M.beats===6&&b===3?1:0));
    setTimeout(()=>mFlash(b),Math.max(0,(t-AC.currentTime)*1000));
    M.next+=60/M.bpm;M.beat=(b+1)%M.beats;
    if(M.beat===0){M.bar++;if(M.ramp.on&&M.bar%M.ramp.bars===0&&M.bpm<M.ramp.target){mSet(Math.min(M.ramp.target,M.bpm+M.ramp.step),true);}}
  }
  if(AC.currentTime-M.since>=60&&M.bpm>S.maxBpm){S.maxBpm=M.bpm;save();}
}
function mFlash(b){if(!M.on)return;document.querySelectorAll('.dots i').forEach((el,i)=>el.classList.toggle('on',i===b));}
function mSet(v,keep){M.bpm=Math.max(30,Math.min(240,Math.round(v)));if(AC)M.since=AC.currentTime;S.bpm=M.bpm;if(!keep)save();mPaint();}
const tempoName=b=>b<60?'Bem devagar':b<80?'Devagar':b<104?'Moderado':b<132?'Animado':'Rápido';
function mPaint(){
  const n=$('#m-num');if(n){n.textContent=M.bpm;$('#m-name').textContent=tempoName(M.bpm);$('#m-slider').value=M.bpm;$('#m-go').textContent=M.on?'Parar':'Iniciar';}
  const p=$('#pill');p.classList.toggle('show',M.on&&!(view==='ferramentas'&&sub.ferramentas==='metronomo'));$('#pill-t').textContent='Metrônomo a '+M.bpm+' BPM';

/* ---------- batidas: tocar junto ---------- */
// O motor toca uma configuração {pid,bpm,prog,click,guitar}: a da aba Batidas (BAT) ou a de um treino montado pela pessoa (CS.cfg).
const BAT={pid:'baixo',bpm:60,prog:null,click:true,touched:false};
const GR={on:false,cfg:BAT,onBar:null,run:0,next:0,step:0,timer:null};
function grStart(cfg,onBar){
  const ac=audio();if(!ac)return;if(M.on)mStop();
  GR.cfg=cfg||BAT;GR.onBar=onBar||null;GR.run++;
  GR.on=true;GR.step=-PAT[GR.cfg.pid].cells.length;GR.next=ac.currentTime+.12;GR.timer=setInterval(grSched,25);render();
}
function grStop(quiet){
  if(!GR.on)return;const mine=CS&&GR.cfg===CS.cfg;if(mine)csAccrue(Date.now()); // parou um treino montado: grava o tempo tocado
  GR.on=false;clearInterval(GR.timer);if(AC)dampAll(AC.currentTime+.05);if(mine)csFlush();if(!quiet)render();
}
function grSched(){
  if(!GR.on||!AC)return;
  while(GR.next<AC.currentTime+.15){grStep(GR.step,GR.next);GR.next+=30/GR.cfg.bpm;GR.step++;}
}
function grStep(step,t){
  const G=GR.cfg,run=GR.run,onBar=GR.onBar,P=PAT[G.pid],n=P.cells.length,dur=30/G.bpm,later=fn=>setTimeout(()=>{if(GR.on&&GR.run===run)fn();},Math.max(0,(t-AC.currentTime)*1000));
  if(step<0){const i=step+n;if(i%2===0){tick(t,i===0?2:0,.9);later(()=>{const s=$('#gr-status');if(s)s.textContent='Contagem: '+(i/2+1);});}return;}
  const bar=Math.floor(step/n),i=step%n,ci=bar%G.prog.length,c=CH[G.prog[ci]],cell=P.cells[i];
  const played=[];c.f.forEach((f,si)=>{if(f>=0)played.push(si);});const m=si=>OPEN[si]+c.f[si];
  if(G.click&&i%2===0)tick(t,i===0?2:0,.35);
  if(G.guitar!==false){
    if(cell==='↓'){played.forEach((si,k)=>pluckAt(m(si),t+k*.016,i===0?.36:.3,si));if(P.stac)dampAll(t+dur*.8);}
    else if(cell==='↑'){played.slice(-4).reverse().forEach((si,k)=>pluckAt(m(si),t+k*.012,.22,si));}
    else if(cell==='x')slapAt(t);
    else if(cell==='B'||cell==='P'){const si=played[(cell==='B'&&i>0&&played.length>1)?1:0];pluckAt(m(si),t,.55,si);}
    else if(cell==='I'||cell==='M'||cell==='A'){const si={I:3,M:4,A:5}[cell];if(c.f[si]>=0)pluckAt(m(si),t,.42,si);}
  }
  later(()=>{document.querySelectorAll('#gr-grid>div').forEach((el,k)=>el.classList.toggle('now',k===i));
    if(i===0){document.querySelectorAll('#gr-prog>span').forEach((el,k)=>el.classList.toggle('now',k===ci));const s=$('#gr-status');if(s)s.textContent='Tocando '+G.prog[ci]+'. Entre quando se sentir pronto.';if(onBar)onBar(ci);}});
}

const STR=[{n:6,l:'E',pt:'Mi',m:40},{n:5,l:'A',pt:'Lá',m:45},{n:4,l:'D',pt:'Ré',m:50},{n:3,l:'G',pt:'Sol',m:55},{n:2,l:'B',pt:'Si',m:59},{n:1,l:'E',pt:'Mi',m:64}];
let MIC=null,micErr=false;
async function micStart(){
  micErr=false;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('sem suporte');
    const ac=audio();if(!ac)throw new Error('sem áudio');
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();an.fftSize=4096;src.connect(an);
    MIC={stream,src,an,buf:new Float32Array(4096),hist:[],timer:setInterval(micTick,95)};
  }catch(e){micErr=true;MIC=null;}
  render();
}
function micStop(){if(!MIC)return;clearInterval(MIC.timer);try{MIC.stream.getTracks().forEach(t=>t.stop());MIC.src.disconnect();}catch(e){}MIC=null;}
function detectPitch(buf,sr){
  const n=buf.length;let rms=0;for(let i=0;i<n;i++)rms+=buf[i]*buf[i];if(Math.sqrt(rms/n)<.008)return 0;
  const minLag=Math.floor(sr/1000),maxLag=Math.min(Math.floor(sr/60),(n>>1)-2),w=n-maxLag-2,c=new Float32Array(maxLag+2);
  for(let lag=0;lag<=maxLag+1;lag++){let s=0;for(let i=0;i<w;i++)s+=buf[i]*buf[i+lag];c[lag]=s;}
  let d=1;while(d<maxLag&&c[d]>c[d+1])d++;
  let best=-1;for(let i=Math.max(d,minLag);i<=maxLag;i++)if(c[i]>best)best=c[i];
  if(best<=0||best/c[0]<.45)return 0;
  let p=-1;for(let i=Math.max(d,minLag)+1;i<maxLag;i++){if(c[i]>=.9*best&&c[i]>=c[i-1]&&c[i]>=c[i+1]){p=i;break;}}
  if(p<0)return 0;
  const a=(c[p-1]+c[p+1]-2*c[p])/2,b=(c[p+1]-c[p-1])/2;const T=a?p-b/(2*a):p;
  return sr/T;
}
function micTick(){
  if(!MIC||!AC)return;MIC.an.getFloatTimeDomainData(MIC.buf);
  const f=detectPitch(MIC.buf,AC.sampleRate),note=$('#t-note');if(!note)return;
  if(!f){if(MIC.hist.length)MIC.hist.shift();if(!MIC.hist.length){$('#t-msg').textContent='Toque uma corda solta perto do celular.';}return;}
  MIC.hist.push(f);if(MIC.hist.length>5)MIC.hist.shift();
  const med=MIC.hist.slice().sort((x,y)=>x-y)[Math.floor(MIC.hist.length/2)];
  let bi=0,bc=1e9;STR.forEach((s,i)=>{const ft=440*Math.pow(2,(s.m-69)/12),ce=1200*Math.log2(med/ft);if(Math.abs(ce)<Math.abs(bc)){bc=ce;bi=i;}});
  const s=STR[bi];note.textContent=s.l;$('#t-str').textContent=s.n+'ª corda, '+s.pt;
  $('#t-needle').style.left=(50+Math.max(-50,Math.min(50,bc)))+'%';
  $('#t-msg').textContent=Math.abs(bc)<=5?'Afinada.':bc<0?'Está grave. Aperte a tarraxa.':'Está aguda. Afrouxe a tarraxa.';
  document.querySelectorAll('.heads button').forEach((b,i)=>b.classList.toggle('hit',i===bi));
}

function chordSVG(n){
  const c=CH[n];if(!c)return '';

  const x=i=>20+i*16,top=28,fh=24;let s='<svg viewBox="0 0 120 132" role="img" aria-label="Diagrama do acorde '+esc(n)+'">';
  for(let i=0;i<6;i++)s+='<line class="g" x1="'+x(i)+'" y1="'+top+'" x2="'+x(i)+'" y2="'+(top+fh*4)+'"/>';
  for(let j=0;j<=4;j++)s+='<line class="g" x1="20" y1="'+(top+fh*j)+'" x2="100" y2="'+(top+fh*j)+'"/>';
  if(base===1)s+='<rect class="nutc" x="19" y="'+(top-5)+'" width="82" height="5" rx="1"/>';
  else s+='<text class="bf" x="104" y="'+(top+fh/2+4)+'">'+base+'ª</text>';
  c.f.forEach((f,i)=>{if(f<=0)s+='<text class="mk" x="'+x(i)+'" y="16">'+(f<0?'×':'○')+'</text>';});
  if(c.barre){const y=top+(c.barre.fret-base+.5)*fh,x1=x(c.barre.from)-8,w=x(c.barre.to)-x(c.barre.from)+16;s+='<rect class="fd" x="'+x1+'" y="'+(y-8)+'" width="'+w+'" height="16" rx="8"/><text class="ft" x="'+(x1+9)+'" y="'+(y+3.5)+'">1</text>';}
  c.f.forEach((f,i)=>{if(f<=0)return;if(c.barre&&f===c.barre.fret&&c.d[i]===1)return;const y=top+(f-base+.5)*fh;s+='<circle class="fd" cx="'+x(i)+'" cy="'+y+'" r="7.5"/><text class="ft" x="'+x(i)+'" y="'+(y+3.5)+'">'+c.d[i]+'</text>';});
  return s+'</svg>';
}

    h+='<div class="bpmrow"><button data-act="gr-bpm" data-d="-4" aria-label="Mais devagar">−</button><div style="text-align:center"><span class="num" id="gr-bpm">'+BAT.bpm+'</span> <span class="muted small">BPM</span></div><button data-act="gr-bpm" data-d="4" aria-label="Mais rápido">+</button></div>';

  }else{

  }
  return h;
};

  return h;
};

function sndPanel(){return '<section class="panel"><h2>Sem som?</h2><p class="sub" id="snd-state">'+esc(sndState())+'</p><button class="btn block" style="margin:14px 0 10px" data-act="snd-test">Testar o som</button><button class="btn block line" data-act="snd-html">Testar com áudio simples</button><div class="between" style="margin-top:16px"><span>Outra saída de som</span><button class="chip" data-act="snd-alt" aria-pressed="'+!!S.altOut+'">'+(S.altOut?'Ligada':'Desligada')+'</button></div><p class="muted small" style="margin-top:6px">Manda o som pelo canal de mídia do aparelho, o mesmo de vídeos e chamadas. Ajuda quando o iPhone está no silencioso.</p><h3 style="margin-top:18px">Diagnóstico</h3><div class="small" id="snd-diag" style="margin-top:4px">'+sndDiag()+'</div><ol class="muted small" style="padding-left:1.2em;line-height:1.6;margin-top:12px"><li>iPhone: desligue a chave de silencioso na lateral.</li><li>Aperte o botão de volume logo depois de tocar em “Testar o som”, para subir o volume de mídia.</li><li>Desconecte fone ou caixa Bluetooth que não esteja por perto.</li>'+(NATIVE?'':'<li>Se continuar mudo dentro do app do Claude, abra o link no Safari ou no Chrome.</li>')+'</ol></section>';}

/* ---------- instalação e atualização (só quando hospedado como PWA, com manifest) ---------- */
const FRAMED=(()=>{try{return window.top!==window.self;}catch(e){return true;}})();
const VER=((document.querySelector('meta[name="app-version"]')||{}).content)||'';
const PWA={host:!NATIVE&&!FRAMED&&!!document.querySelector('link[rel="manifest"]'),prompt:null,reg:null,update:false,lastCheck:0,help:false,msg:''};
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
function installSteps(){
  const ua=navigator.userAgent,inApp=/FBAN|FBAV|Instagram|Line\/|MicroMessenger|TikTok/i.test(ua);
  if(inApp)return '<p class="sub">Este link abriu dentro de outro aplicativo. Toque no menu (⋯) e escolha abrir no navegador. Depois volte aqui para instalar.</p>';
  if(IOS)return '<ol class="steps muted"><li>Abra este link no Safari.</li><li>Toque no botão Compartilhar, o quadrado com a seta para cima.</li><li>Role a lista e toque em “Adicionar à Tela de Início”.</li><li>Confirme em “Adicionar”. O ícone aparece junto dos outros apps.</li></ol>';
  if(/Android/i.test(ua))return '<ol class="steps muted"><li>Abra este link no Chrome.</li><li>Toque no menu ⋮, no canto de cima.</li><li>Toque em “Instalar app” ou “Adicionar à tela inicial”.</li><li>Confirme em “Instalar”.</li></ol>';
  return '<p class="sub">No Chrome ou no Edge, clique no ícone de instalar na barra de endereço. No celular, abra este mesmo link e siga os passos na tela.</p>';
}
function installPanel(){
  if(NATIVE)return '<section class="panel"><h2>Sobre o app</h2><div class="kv" style="margin-top:6px"><span>Versão</span><b>'+esc(VER||'sem número')+'</b></div></section>';
  if(!PWA.host)return '';
  let x='<section class="panel"><h2>App no celular</h2>';
  if(standalone())x+='<p class="sub">Instalado neste aparelho. Ele busca a versão nova sozinho sempre que abre com internet.</p>';
  else if(PWA.prompt)x+='<p class="sub">Abre em tela cheia, funciona sem internet e se atualiza sozinho.</p><button class="btn block" style="margin-top:14px" data-act="pwa-install">Instalar app</button>';
  else x+='<p class="sub">Abre em tela cheia, funciona sem internet e se atualiza sozinho.</p>'+installSteps();
  x+='<div class="kv" style="margin-top:12px;border-top:1px solid var(--line)"><span>Versão</span><b>'+esc(VER||'sem número')+'</b></div><button class="btn block line" data-act="pwa-check">Buscar atualização</button>'+(PWA.msg?'<p class="sub small" style="margin-top:10px" role="status">'+esc(PWA.msg)+'</p>':'')+'</section>';
  return x;
}
function installBanner(){
  if(!PWA.host||standalone()||S.installDismissed)return '';
  return '<section class="panel" style="margin-bottom:14px"><h3>Instale no celular</h3><p class="sub">Vira um app com ícone, abre em tela cheia, funciona sem internet e se atualiza sozinho.</p>'+(IOS&&!S.onboarded?'<p class="sub small">No iPhone, instale antes de começar: o app instalado e o Safari guardam o progresso separados.</p>':'')+(PWA.help&&!PWA.prompt?installSteps():'')+'<div class="acts" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center">'+(PWA.prompt?'<button class="btn sm" data-act="pwa-install">Instalar app</button>':(PWA.help?'':'<button class="btn sm" data-act="pwa-help">Ver como instalar</button>'))+'<button class="link" data-act="pwa-dismiss">Agora não</button></div></section>';
}
function updPaint(){const w=$('#upd-wrap');if(w)w.hidden=!PWA.update;}
async function checkUpdate(force){
  if(!PWA.host||!VER)return;const now=Date.now();if(!force&&now-PWA.lastCheck<36e5)return;PWA.lastCheck=now;
  try{if(PWA.reg)PWA.reg.update().catch(()=>{});
    const r=await fetch(location.pathname+'?check='+now,{cache:'no-store'});if(!r.ok)throw new Error('http');
    const m=(await r.text()).match(/<meta name="app-version" content="([^"]+)"/);
    if(m&&m[1]!==VER){PWA.update=true;PWA.msg='Versão '+m[1]+' disponível.';updPaint();}else if(force)PWA.msg='Você já está na versão mais recente.';
  }catch(e){if(force)PWA.msg='Sem conexão para verificar agora.';}
  if(force)render();
}
if(PWA.host){
  if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){navigator.serviceWorker.register('sw.js').then(r=>{PWA.reg=r;}).catch(()=>{});}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();PWA.prompt=e;render();});
  window.addEventListener('appinstalled',()=>{PWA.prompt=null;render();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false);});
}

/* ---------- render + nav ---------- */
const TABS=[['hoje','Hoje','<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/>'],['meu','Meu treino','<path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>'],['treinar','Treinar','<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>'],['ferramentas','Ferramentas','<path d="M9 3h6l4 18H5L9 3zM12 17l4-11M7.2 13h9.6"/>'],['acordes','Acordes','<path d="M5 4v16M12 4v16M19 4v16M5 4h14M5 10h14M5 16h14"/><circle cx="12" cy="7" r="1.7" fill="currentColor"/>'],['evolucao','Evolução','<path d="M5 20V11M12 20V4M19 20v-6M2 20h20"/>']];
function render(){
  $('#view').innerHTML=V[view]();
  $('#tabs').innerHTML=TABS.map(t=>'<button data-act="nav" data-v="'+t[0]+'"'+(view===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</button>').join('');
  mPaint();awakeSync();
}
function go(v){grStop(true);if(!(v==='ferramentas'&&sub.ferramentas==='afinador'))micStop();if(T.phase==='count'||T.phase==='run')T.phase='idle';resetArmed=false;ceDelArmed=false;view=v;render();window.scrollTo(0,0);}

const ACT={
  nav:el=>go(el.dataset.v),
  sub:el=>{const g=el.dataset.g;sub[g]=el.dataset.v;if(g==='treinar')grStop(true);if(g==='ferramentas'&&sub[g]!=='afinador')micStop();if(g==='ouvido')E.q=null;if(g==='treinar'&&(T.phase==='count'||T.phase==='run'))T.phase='idle';render();},
  'ob-level':el=>{ob.level=+el.dataset.v;render();},
  'ob-goal':el=>{ob.goal=+el.dataset.v;render();},
  'ob-go':()=>{S.level=ob.level;S.goal=ob.goal;S.onboarded=true;save();audio();render();},
  'blk-start':el=>{audio();B={id:el.dataset.id,total:+el.dataset.min,left:+el.dataset.min*60,running:true,last:Date.now()};render();},
  'blk-pause':()=>{if(!B)return;B.running=!B.running;B.last=Date.now();render();},
  'blk-done':el=>{if(!B)return;const used=Math.max(1,Math.round((B.total*60-B.left)/60));blockDone(el.dataset.id,Math.min(B.total,used));},
  'free-add':el=>{addMinutes(+el.dataset.v);render();},
  'open-metro':el=>{mSet(+el.dataset.bpm);sub.ferramentas='metronomo';go('ferramentas');},
  'open-trocas':el=>{T.a=el.dataset.a;T.b=el.dataset.b;sub.treinar='trocas';go('treinar');},
  'open-batida':el=>{BAT.touched=true;BAT.pid=el.dataset.p;BAT.bpm=+el.dataset.bpm;sub.treinar='batidas';go('treinar');},
  'gr-toggle':()=>{GR.on?grStop():grStart(BAT);},
  'gr-pat':el=>{grStop(true);BAT.pid=el.dataset.v;BAT.bpm=PAT[BAT.pid].bpm;render();},
  'gr-prog':el=>{grStop(true);BAT.prog=PROGS[+el.dataset.i];render();},
  'gr-bpm':el=>{BAT.bpm=Math.max(40,Math.min(160,BAT.bpm+(+el.dataset.d)));const n=$('#gr-bpm');if(n)n.textContent=BAT.bpm;},
  'gr-click':()=>{BAT.click=!BAT.click;if(GR.on){const b=document.querySelector('[data-act="gr-click"]');if(b){b.setAttribute('aria-pressed',BAT.click);b.textContent=BAT.click?'Ligado':'Desligado';}}else render();},
  'open-meu':()=>{go('meu');},
  'ce-new':()=>{ceNew();render();window.scrollTo(0,0);},
  'ce-edit':el=>{const t=S.custom.find(x=>x.id===el.dataset.id);if(!t)return;CE=ctClean(t);ceDelArmed=false;render();window.scrollTo(0,0);},
  'ce-cancel':()=>{CE=null;ceDelArmed=false;render();window.scrollTo(0,0);},
  'ce-suggest':()=>{const L=LEVELS[S.level-1];CE.chords=L.prog[0].slice();CE.pats=[L.rhythm];CE.bpm=L.bpm;render();},
  'ce-add':el=>{if(CE.chords.length>=CT_MAX)return;CE.chords.push(el.dataset.c);strum(chordMidis(el.dataset.c),.045);render();},
  'ce-del':el=>{CE.chords.splice(+el.dataset.i,1);render();},
  'ce-pat':el=>{const v=el.dataset.v,k=CE.pats.indexOf(v);if(k>=0)CE.pats.splice(k,1);else CE.pats.push(v);render();},
  'ce-bpm':el=>{CE.bpm=Math.max(40,Math.min(160,CE.bpm+(+el.dataset.d)));render();},
  'ce-min':el=>{CE.min=+el.dataset.v;render();},
  'ce-save':()=>{if(!CE.chords.length||!CE.pats.length)return;ceSave();ctMsg='Treino salvo.';render();window.scrollTo(0,0);},
  'ce-start':()=>{if(!CE.chords.length||!CE.pats.length)return;csStart(ceSave());},
  'ce-remove':()=>{if(!ceDelArmed){ceDelArmed=true;render();return;}S.custom=S.custom.filter(x=>x.id!==CE.id);delete S.ctLog[CE.id];save();CE=null;ceDelArmed=false;render();window.scrollTo(0,0);},
  'ct-hist':el=>{if(CS&&CS.done)CS=null;CE=null;CHI=el.dataset.id;render();window.scrollTo(0,0);},
  'ct-back':()=>{CHI=null;render();window.scrollTo(0,0);},
  'cs-start':el=>{csStart(S.custom.find(x=>x.id===el.dataset.id));},
  'cs-toggle':()=>{if(csOn())grStop();else csPlay();},
  'cs-nextpat':()=>{csNextPat();},
  'cs-bpm':el=>{CS.cfg.bpm=Math.max(40,Math.min(160,CS.cfg.bpm+(+el.dataset.d)));const n=$('#cs-bpm');if(n)n.textContent=CS.cfg.bpm;},
  'cs-guitar':el=>{CS.cfg.guitar=CS.cfg.guitar===false;el.setAttribute('aria-pressed',CS.cfg.guitar);el.textContent=CS.cfg.guitar?'Ligado':'Desligado';},
  'cs-click':el=>{CS.cfg.click=!CS.cfg.click;el.setAttribute('aria-pressed',CS.cfg.click);el.textContent=CS.cfg.click?'Ligado':'Desligado';},
  'cs-end':()=>{csFinish();},
  'cs-again':()=>{csStart(CS.t);},
  'cs-close':()=>{CS=null;render();window.scrollTo(0,0);},
  note:el=>{const si=+el.dataset.si,f=+el.dataset.f,m=OPEN[si]+f,pc=m%12;if(audio())pluckAt(m,AC.currentTime+.01,.7,si);
    document.querySelectorAll('.fb .hit,.scale .hit').forEach(x=>x.classList.remove('hit'));
    const cell=document.querySelector('.fb [data-si="'+si+'"][data-f="'+f+'"]');if(cell)cell.classList.add('hit');if(el.closest('.scale'))el.classList.add('hit');
    const i=$('#fb-info');if(i)i.textContent=NPT[pc]+' ('+NL[pc]+'), '+(6-si)+'ª corda, '+(f?'casa '+f:'solta')+'.';},
  'scale-play':()=>{if(!audio())return;const t0=AC.currentTime+.05;SCALE.forEach((p,k)=>{pluckAt(OPEN[p[0]]+p[1],t0+k*.5,.7,p[0]);setTimeout(()=>{document.querySelectorAll('.scale button').forEach((b,j)=>b.classList.toggle('hit',j===k));},50+k*500);});setTimeout(()=>document.querySelectorAll('.scale .hit').forEach(b=>b.classList.remove('hit')),50+SCALE.length*500+400);},
  'fb-all':()=>{sub.fball=!sub.fball;render();},
  'pwa-install':()=>{const p=PWA.prompt;if(!p)return;try{p.prompt();p.userChoice.then(()=>{PWA.prompt=null;render();}).catch(()=>{});}catch(e){}},
  'pwa-help':()=>{PWA.help=true;render();},
  'pwa-dismiss':()=>{S.installDismissed=true;save();render();},
  'pwa-check':()=>{PWA.msg='Verificando';render();checkUpdate(true);},
  'pwa-reload':()=>{location.reload();},
  'snd-test':()=>{sndAsked=true;unlock();DIAG.sig=null;DIAG.clock=null;
    if(!audio()){sndPaint();return;}
    const t0=AC.currentTime,b=new Float32Array(1024),bb=new Uint8Array(1024);let mx=0,n=0;strum(chordMidis('G'),.05);tick(AC.currentTime+.6,2);
    const iv=setInterval(()=>{try{let s=0;if(METER.getFloatTimeDomainData){METER.getFloatTimeDomainData(b);for(let i=0;i<b.length;i++)s+=b[i]*b[i];}else{METER.getByteTimeDomainData(bb);for(let i=0;i<bb.length;i++){const v=(bb[i]-128)/128;s+=v*v;}}mx=Math.max(mx,Math.sqrt(s/1024));}catch(e){}
      if(++n>=9){clearInterval(iv);DIAG.sig=mx;DIAG.clock=AC.currentTime-t0;sndPaint();}},100);},
  'snd-html':()=>{htmlTest();},
  'snd-alt':()=>{S.altOut=!S.altOut;save();if(audio())route();render();},
  'm-toggle':()=>{M.on?mStop():mStart();},
  'm-bpm':el=>mSet(M.bpm+(+el.dataset.d)),
  'm-tap':()=>{audio();const n=performance.now();M.taps=M.taps.filter(t=>n-t<2500);M.taps.push(n);if(M.taps.length>=2){const iv=(M.taps[M.taps.length-1]-M.taps[0])/(M.taps.length-1);mSet(60000/iv);}},
  'm-beats':el=>{M.beats=+el.dataset.v;S.beats=M.beats;M.beat=0;save();render();},
  'm-ramp':()=>{M.ramp.on=!M.ramp.on;M.bar=0;render();},
  tone:el=>{pluck(STR[+el.dataset.i].m,0,.75);},
  mic:()=>{if(MIC){micStop();render();}else micStart();},
  't-start':()=>{audio();if(T.a===T.b)return;T.phase='count';T.startAt=Date.now()+3000;render();},
  't-reset':()=>{T.phase='idle';render();},
  'ear-play':()=>{if(!E.q)earNew();strum(E.q.midis,.03);},
  'ear-ans':el=>{if(E.ans||!E.q)return;E.ans=el.dataset.v;const ok=E.ans===E.q.ans;E.total++;S.ear.total++;if(ok){E.ok++;S.ear.ok++;}save();render();},
  'ear-next':()=>{earNew();strum(E.q.midis,.03);render();},
  'chord-play':el=>strum(chordMidis(el.dataset.c),.045),
  'chord-st':el=>{const c=el.dataset.c,cur=S.chords[c];if(!cur)S.chords[c]='aprendendo';else if(cur==='aprendendo')S.chords[c]='dominado';else delete S.chords[c];save();render();},
  skill:el=>{const k=el.dataset.k;if(S.skills[k])delete S.skills[k];else S.skills[k]=true;save();render();},
  'set-level':el=>{S.level=+el.dataset.l;B=null;E.q=null;save();render();},
  'song-add':()=>{const t=$('#s-title').value.trim(),c=$('#s-chords').value.trim();if(!t){$('#s-title').focus();return;}S.songs.push({id:'s'+Date.now().toString(36),title:t.slice(0,80),chords:c.slice(0,120),status:'aprendendo'});save();render();},
  'song-del':el=>{S.songs=S.songs.filter(s=>s.id!==el.dataset.id);save();render();},
  goal:el=>{S.goal=+el.dataset.v;B=null;save();render();},
  reset:()=>{if(!resetArmed){resetArmed=true;render();return;}try{localStorage.removeItem(KEY);}catch(e){}if(NATIVE)native('Preferences','remove',{key:KEY});adopt(null);B=null;CE=null;CS=null;CHI=null;E.q=null;E.ok=E.total=0;resetArmed=false;view='hoje';render();}
};
const NOISY=/^(tone|chord-play|ear-play|ear-next|gr-toggle|m-toggle|note|scale-play|blk-start|t-start|ce-add|ce-start|cs-start|cs-toggle|cs-again)$/;
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,fn=ACT[a];if(fn)fn(el);if(NOISY.test(a)){sndAsked=true;setTimeout(sndPaint,900);}});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-tap]');if(!el||T.phase!=='run')return;e.preventDefault();T.count++;const n=$('#t-n');if(n)n.textContent=T.count;buzz(12);});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='m-slider')mSet(+e.target.value);
  else if(id==='r-step')M.ramp.step=Math.max(1,Math.min(20,+e.target.value||5));
  else if(id==='r-bars')M.ramp.bars=Math.max(1,Math.min(32,+e.target.value||4));
  else if(id==='r-target')M.ramp.target=Math.max(40,Math.min(240,+e.target.value||120));
  else if(id==='ce-name'&&CE)CE.name=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='t-a'){T.a=t.value;render();}else if(t.id==='t-b'){T.b=t.value;render();}
  else if(t.dataset&&t.dataset.song){const s=S.songs.find(x=>x.id===t.dataset.song);if(s){s.status=t.value;save();}}});
function onShow(){if(AC&&AC.state!=='running'){try{AC.resume().catch(()=>{});}catch(e){}}if(!NATIVE&&awakeOn)awakeSync(true);}
function onHide(){if(SIL&&!SIL.paused)SIL.pause();if(MIC){micStop();render();}if(GR.on)grStop();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)onHide();else onShow();});

render();updPaint();

if(NATIVE){
  const on=(plugin,ev,fn)=>{try{PLUG[plugin]&&PLUG[plugin].addListener(ev,fn);}catch(e){}};
  // Botão voltar do Android: encerra a contagem de trocas, depois volta para Hoje e, em Hoje, minimiza o app.
  on('App','backButton',()=>{if(T.phase==='count'||T.phase==='run'){T.phase='idle';render();}else if(view!=='hoje')go('hoje');else native('App','minimizeApp');});
  on('App','appStateChange',st=>{if(st&&st.isActive)onShow();else onHide();});
  // Progresso: se o armazenamento da WebView veio vazio, recupera a cópia guardada pelo app.
  if(hadLocal)save();
  else{const p=native('Preferences','get',{key:KEY});if(p&&p.then)p.then(r=>{let o=null;try{o=r&&r.value?JSON.parse(r.value):null;}catch(e){}
    if(!o||typeof o!=='object'||S.onboarded)return;adopt(o);M.bpm=S.bpm||70;M.beats=S.beats||4;save();render();});}
  // Tira a tela de abertura quando a fonte embutida e a primeira tela estiverem prontas.
  const hide=()=>native('SplashScreen','hide');
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(hide,hide);
}
})();
